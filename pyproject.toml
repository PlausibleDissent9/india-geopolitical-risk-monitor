[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igrm"
# Package version tracks CODE (methodology section 12: the contract,
# the methodology document, and the package version independently).
# 0.x on purpose: the import-name restructure (src -> igrm) waits for
# a quiet slot because live cron lanes execute python -m src.* today;
# until then `pip install .` provides the pipeline under its current
# import package `src`, documented in README. No PyPI upload (hard
# limit); install from a checkout.
version = "0.1.0"
description = "India Geopolitical Risk Monitor pipeline: a reproducible press-salience index (measures salience, not risk; makes no forecasts)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "pandas>=2",
  "numpy>=1.26",
  "scipy>=1.10",
  "cryptography>=50,<51",
  "jsonschema>=4.25,<4.26",
  "requests>=2.31",
  "yfinance>=0.2",
  "Markdown>=3.6",
]

[project.optional-dependencies]
# Display-layer machine labeling only; every score computes without it.
brief = ["anthropic==0.121.0"]

[project.urls]
Homepage = "https://igrm.in"
Repository = "https://github.com/PlausibleDissent9/india-geopolitical-risk-monitor"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP007/UP045 (X | None syntax) need py310 at runtime; we run 3.9 with
# postponed evaluation, so annotations may use it but code must not.
ignore = ["E501"]

[tool.mypy]
# 3.11 matches the CI runtime (the production interpreter); 3.9 made
# mypy choke parsing match statements in anthropic's anyio dependency
# (2026-08-04: six consecutive red ci runs). Local runtime code still
# stays 3.9-compatible for the laptop venv's heal path.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# "live" marks tests that assert on the CURRENT state of published
# payloads rather than on code behaviour: freshness, the _meta stamp
# promise, served-data invariants.
#
# They are real checks and they run in CI and in the daily enrichment
# lane. They must NOT run in morning.yml, whose first gate is the test
# suite and whose job is to publish by 06:00 IST. A weekly lane running
# one day late would make a freshness assertion fail and block a publish
# that is itself perfectly correct -- the gate would be enforcing
# something that has nothing to do with whether today's index is right.
markers = [
    "live: asserts on current published-payload state, not code behaviour",
]
