name: multilingual-backfill

# V5 collector on CI runners: each batch gets a fresh runner IP, which
# the laptop-throttled rate limiter treats far more kindly. Same
# self-chaining pattern as events-backfill: commit the chunk cache
# every attempt, re-dispatch only while progressing, stop when the
# store publishes or progress stalls.

on:
  workflow_dispatch:
  schedule:
    # Nightly restarts until the store lands: the DOC API throttles
    # hard in busy hours (2026-08-01: a fresh-IP batch got zero chunks),
    # so the chain retries in quiet windows and ends itself once
    # multilingual_salience.csv exists. Odd minutes per repo convention.
    - cron: "47 21 * * *"   # 03:17 IST
    - cron: "9 1 * * *"     # 06:39 IST backup
  push:
    branches: [main]
    paths: [".trigger/multilingual"]

permissions:
  contents: write
  actions: write

concurrency:
  # Scoped by ref: an unscoped group lets a Dependabot PR branch's push
  # event queue a run in the same lane as main and starve it
  # (2026-08-02, see daily.yml for the mechanism).
  group: igrm-multilingual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Count stored series before
        id: before
        # Progress means SERIES IN THE STORE, not files in the chunk
        # cache. Counting chunks was the bug: the fetch cached every
        # request it made and then died before writing the store, so the
        # chain saw a growing cache, called it progress, and
        # re-dispatched itself 70 times across 7 days without ever
        # producing the artifact it existed to produce.
        run: |
          python -m src.multilingual --status || true
          echo "n=$(python -c "from src import multilingual as m; print(len(m.expected_keys()) - len(m.missing_keys()))")" >> "$GITHUB_OUTPUT"
      - name: Fetch batch (resumes from the store, series by series)
        id: fetch
        # continue-on-error so the commit step below still banks whatever
        # landed -- a throttled batch that got two series must not lose
        # them. But the outcome is CHECKED at the end of the job rather
        # than discarded: src/multilingual.py raises SystemExit when zero
        # series land, specifically so a fruitless batch is visible, and
        # laundering that into a green run threw away the one signal the
        # module goes out of its way to produce.
        #
        # Runs #70 and #71 on 2026-08-07 both reported success with the
        # store still absent. V5 has been stalled for days behind a green
        # tick.
        continue-on-error: true
        timeout-minutes: 45
        run: python -m src.multilingual --backfill
      - name: Stamp payload metadata and asset versions
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta || true
          python -m src.stamp_assets || true
      - name: Commit progress
        id: commit
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add data/raw/gdelt_chunks data/raw/multilingual_salience.csv docs/data/multilingual.json 2>/dev/null || true
          git commit -m "multilingual chunk cache: $(date -u +%FT%TZ)" || echo "no changes"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then pushed=1; break; fi
            sleep $((10 * i))
          done
          [ "$pushed" = "1" ]
          echo "n=$(python -c "from src import multilingual as m; print(len(m.expected_keys()) - len(m.missing_keys()))")" >> "$GITHUB_OUTPUT"
      - name: Re-trigger while incomplete and progressing
        run: |
          BEFORE="${{ steps.before.outputs.n }}"
          AFTER="${{ steps.commit.outputs.n }}"
          # "Done" is every registered series present in the store, not
          # the store file merely existing -- with incremental writes,
          # one series in would otherwise read as finished.
          if python -m src.multilingual --status; then DONE=1; else DONE=0; fi
          echo "series stored $BEFORE -> $AFTER; complete: $DONE"
          if [ "$DONE" = "0" ] && [ "$AFTER" -gt "$BEFORE" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/multilingual-backfill.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "next batch dispatched"
          else
            echo "chain ends: done=$DONE progressed=$([ "$AFTER" -gt "$BEFORE" ] && echo yes || echo no)"
          fi
      - name: A batch that landed nothing is a failure, not a quiet success
        # Last, so the commit above has already banked any partial
        # progress. The job's conclusion now means what it says: green
        # when the store grew or the backfill is complete, red when a
        # batch fetched nothing and the artifact still does not exist.
        #
        # Deliberately not red merely for being incomplete -- V5 is a long
        # backfill and "not finished yet" is the normal state. This fires
        # only when a run made NO progress AND the fetch itself failed,
        # which is upstream refusing us rather than the work being large.
        if: always()
        run: |
          BEFORE="${{ steps.before.outputs.n }}"
          AFTER="${{ steps.commit.outputs.n }}"
          if python -m src.multilingual --status; then
            echo "backfill complete"; exit 0
          fi
          if [ "${AFTER:-0}" -gt "${BEFORE:-0}" ]; then
            echo "progress: $BEFORE -> $AFTER series"; exit 0
          fi
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then
            echo "::error::batch landed no series and the fetch failed" \
                 "($BEFORE -> $AFTER). Upstream is refusing us; V5 is" \
                 "stalled rather than merely unfinished."
            exit 1
          fi
          echo "no progress but the fetch did not error; not flagging"
