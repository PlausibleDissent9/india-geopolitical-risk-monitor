name: permanence

on:
  schedule:
    # After each daily-update slot has published and Pages has
    # deployed: the archives capture the day's final pages, not a
    # mid-deploy state. Odd minutes on purpose (congested :00/:30
    # slots get silently dropped).
    - cron: "37 1 * * *"    # 07:07 IST, after the morning final
    - cron: "23 16 * * *"   # 21:53 IST, after the evening slot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igrm-permanence
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Snapshot site + register repo (fail-soft by design)
        run: python -m src.permanence
      - name: Stamp payload metadata and asset versions
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta
          python -m src.stamp_assets
      - name: Commit the permanence record
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add docs/data/permanence.json
          bash scripts/publish_push.sh "permanence: archive snapshot record $(date -u +%F)"
