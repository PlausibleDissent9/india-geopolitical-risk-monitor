name: reproduce

# Rights-safe public reconstruction, verified monthly. A fresh clone and
# venv rebuild every published channel/composite cell from the public
# codebook and shares and require exact equality with the published series.
# It deliberately makes no claim about market-dependent outputs whose exact
# input vintage is not redistributable in this repository.

on:
  schedule:
    - cron: "37 2 1 * *"   # monthly, 1st, 08:07 IST
  workflow_dispatch:
  push:
    branches: [main]
    # A proof run must follow any change to its own environment or
    # procedure. Editing this file remains the no-CLI manual dispatch.
    paths:
      - ".github/workflows/reproduce.yml"
      - "scripts/reproduce.sh"
      - "requirements.txt"
      - "requirements-dev.txt"

# run-stamp: 2026-08-06 (first proof run: the job existed for a week
# without ever running once, which made "reproduce-from-nothing CI" a
# claim without a receipt)

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fresh-clone public index reconstruction
        run: bash scripts/reproduce.sh --public
