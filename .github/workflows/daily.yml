name: daily-update

on:
  schedule:
    # Primary runs EARLY so that even with GitHub's cron drift (often
    # 15-90 min) the site is fresh before the promised 18:00 IST. The
    # measured day (previous UTC day) completes at 05:30 IST, so any
    # daytime run is valid; later slots are drift insurance.
    # Odd minutes on purpose: GitHub silently drops scheduled runs at
    # congested minutes, and :00/:30 are the worst (2026-07-31: the
    # 11:00 slot never fired at all).
    # Morning contract (Ishan + FICCI feedback, 2026-07-31): the measured
    # day closes 05:30 IST, final publishes by 06:00 IST. Aimed early
    # because GitHub crons drift 15-90 min; the second slot is the
    # backup. Afternoon slot retained as drift insurance of last resort.
    - cron: "7 0 * * *"     # 05:37 IST primary
    - cron: "51 0 * * *"    # 06:21 IST backup
    # Backup slot: GitHub crons fire late or not at all under load, so a
    # second attempt guarantees at least one daily run; when the first
    # succeeded this one commits "no changes" and costs nothing.
    - cron: "23 15 * * *"   # 20:53 IST
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run full backfill from 2017-01-01 (first run: yes)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".trigger/backfill"]  # committing this file requests a backfill run

permissions:
  contents: write

# One pipeline run at a time: a late-firing cron must queue behind a
# dispatched backfill, not race it for git pushes.
concurrency:
  # Lane name is bumped when a long-running obsolete run would otherwise
  # hold the queue and starve runs carrying a fix. Scoped by ref: without
  # this, a Dependabot PR branch rebased onto main carries main's
  # .trigger/backfill-touching commit along in its push event, which
  # matches this workflow's path filter and queues a run on the PR
  # branch in the SAME lane as main -- starving the real run
  # (2026-08-02: exactly this stuck a manually-kicked verification run
  # in "pending" behind two Dependabot-branch runs).
  group: igrm-pipeline-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A JOB-LEVEL BOUND, BECAUSE THE CONCURRENCY GROUP MAKES A HANG
    # CONTAGIOUS. `cancel-in-progress: false` above means a wedged run does
    # not merely waste itself -- it HOLDS THE LANE, and the 06:21 and 20:53
    # backup crons queue behind it rather than replacing it. Without this,
    # GitHub's 360-minute default applied, so one hang could eat the whole
    # day and both of its insurance slots.
    # Measured end-to-end on successful runs: 143.2 (#95), 147.2 (#97),
    # 160.3 (#99) minutes. 240 leaves ~50% headroom over the slowest
    # observed run while releasing the lane inside the same day.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Freeze finalized-publication target and parent
        id: final_contract
        run: |
          CONTRACT_TODAY=$(date -u +%F)
          TARGET=$(date -u -d "$CONTRACT_TODAY - 1 day" +%F)
          echo "today=$CONTRACT_TODAY" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "base_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Enforce dictionary rules (ex-ante rule)
        # -m "not live", matching morning.yml, and for a reason that is
        # sharper here than there. morning.yml already documents that
        # assertions about the CURRENT state of published payloads must not
        # gate a publish. This lane is where ignoring that closed a loop:
        #
        #   THIS LANE PRODUCES comparators, episode_terms, receipts,
        #   receipts_archive, spike_breadth and validation. Those six went
        #   stale on the live site. The live freshness test therefore failed.
        #   It ran HERE, as this lane's FIRST step, with no
        #   continue-on-error -- so the lane died before the heal, before the
        #   pipeline, before it could refresh the very payloads whose
        #   staleness killed it. Six stale payloads, and the only lane that
        #   refreshes them refusing to start because they were stale.
        #
        # Measured: daily #109 (2026-08-11) failed at this step, as did #107
        # and #106. Every publisher then failed too, because the six stale
        # payloads that nothing could refresh also failed the gate inside
        # publish_push.sh (fixed separately, see scripts/gate.sh --publish).
        #
        # The live assertions are not lost: ci.yml runs them on every push to
        # main, where a stale site is an alert rather than a lock.
        #
        # 2026-08-17: THE SAME SHAPE, WITHOUT A LIVE ASSERTION IN SIGHT.
        # A direct push to main (4654941) added a workflow, which
        # regenerated data/security_integrity.json, which
        # docs/data/public_api_byte_manifest.json pins by digest. The
        # manifest was not re-derived, so main carried a stale pin and
        # this step went red -- and this step is a FULL suite run, so it
        # ran the manifest's consistency tests, failed, and killed the
        # lane at step 6 of 47.
        #
        # The repair already exists and was already automatic:
        # scripts/publish_push.sh calls refresh_public_api_byte_manifest
        # after the rebase and BEFORE the gate, so any lane reaching its
        # publish step heals a stale manifest by itself. No lane reached
        # its publish step. The ex-ante gate stops the run twenty-odd
        # steps before the code that would have fixed the thing the gate
        # is complaining about.
        #
        # That is the same deadlock as the live-freshness one above,
        # relocated: an assertion that the tree is ALREADY consistent,
        # placed ahead of the work that makes it consistent. It is
        # recorded rather than fixed because the ex-ante gate is load
        # bearing -- it is what stops this lane computing for forty
        # minutes on a tree that cannot publish -- and moving it is a
        # publish-path change that wants its own review and its own
        # mutation test, not a 3am edit inside an outage. What removes
        # the trigger entirely is not pushing to main outside
        # publish_push.sh; when that is unavoidable, run the full
        # -m "not live" suite first, which is exactly the check that
        # caught this one.
        run: python -m pytest -q -m "not live"
      - name: Acquire exact finalized target (maintainer-sanctioned bridge)
        id: final_source
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        run: |
          python -m src.final_publication \
            --acquire-target "${{ steps.final_contract.outputs.target }}" \
            --today "${{ steps.final_contract.outputs.today }}" \
            --base-commit "${{ steps.final_contract.outputs.base_commit }}"
      - name: Harvest missing historical chunks (opportunistic, self-ending)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: python -m src.fetch_gdelt --harvest
      - name: Events stream - recent days (V2, static files, not the API)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 15
        # 780s, two minutes inside the step cap. Worst case here is
        # 5*(3*120 + 30 + 1) = 32.6 min, so on a slow CDN day this stops
        # with the days it landed saved rather than being SIGKILLed with
        # nothing reported. Days are independent, so an early stop leaves
        # the rest in _missing_days for the next run.
        run: python -m src.fetch_events --deadline-seconds 780 --update 5
      - name: PortWatch chokepoint transits (V2, IMF ArcGIS, ~2 requests)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.fetch_portwatch --update
      - name: Chokepoint salience tail + divergence JSON (V2-4, ~4 requests)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 15
        # 780s = 13 minutes, two minutes inside the step cap. The module
        # refuses to START a fetch it cannot finish, so the lane gets a
        # named exit and an unchanged store instead of a SIGKILL at 15:00
        # with nothing written. fetch_gdelt's worst case here is ~29
        # minutes, so on a slow GDELT day this step is SUPPOSED to refuse;
        # the point is that it refuses legibly.
        run: python -m src.chokepoints --update --deadline-seconds 780
      - name: Map aggregates (V2 maps; refuses until events history is complete)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.maps_data
      - name: World State Matrix (complete geometry-layer denominator)
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 5
        run: python -m src.world_state
      - name: Comparator tails (V3; bounded and country-checkpointed)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python -m src.comparators --update --deadline-seconds 720
      - name: Stress gauge (V2-2; refuses until events history is complete)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.stress_gauge
      - name: Run pipeline
        # THE ONE UNBOUNDED STEP IN THIS WORKFLOW, UNTIL NOW.
        # Every other step here carries a timeout; this one -- the step the
        # daily contract actually depends on -- carried none, so it
        # inherited GitHub's 360-minute default. On 2026-08-09 run #103 sat
        # inside `python -m src.run_daily` for 84 minutes and counting,
        # against a worst observed incremental run of 20.7 minutes.
        # 120 covers the backfill branch below, whose retry loop is
        # deliberately slow: 12 passes with a 240s cooldown each is 48
        # minutes of sleeping before a single pass's own work is counted.
        # The incremental branch is bounded far more tightly, in-line.
        timeout-minutes: 120
        # Backfill mode supervises itself: GDELT's rate limiter kills
        # naive runs mid-fetch, so retry with cooldowns inside one job,
        # committing the chunk cache between passes -- progress survives
        # even a job-level timeout, and each pass resumes from cache.
        run: |
          # pipefail is load-bearing: `python ... | tee` otherwise reports
          # tee's exit status, so a dead pass looked like a successful one
          # and the retry loop broke on the first iteration.
          set -o pipefail
          # Backfill only when explicitly requested or when no store exists.
          # A push no longer forces one: now that the store is committed,
          # re-running the backfill would spend hundreds of requests to
          # rebuild data already in the repo -- and keep the rate limiter
          # angry for the daily incremental run that actually matters.
          if [ "${{ github.event.inputs.backfill }}" = "true" ] || [ ! -f data/raw/gdelt_volume.csv ]; then
            # No store yet means the first backfill hasn't landed: every
            # run (cron included) keeps attempting it on a fresh runner
            # IP until the monotone chunk cache carries it over the line.
            git config user.name "igrm-bot"
            git config user.email "actions@github.com"
            ok=0
            for i in $(seq 1 12); do
              echo "::group::backfill pass $i"
              if python -m src.run_daily --backfill 2>&1 | tee pass.log; then
                ok=1; echo "::endgroup::"; break
              fi
              echo "::endgroup::"
              # Surface the failure diagnosably: commit the tail of the
              # dying pass so the cause is readable straight from the repo.
              { echo "== run ${{ github.run_number }} pass $i $(date -u) =="; tail -25 pass.log; } \
                > data/raw/last_backfill_failure.log || true
              git add data/raw || true
              git commit -m "backfill chunk cache: pass $i" || true
              # Best-effort: this is the intermediate chunk-cache commit
              # banking progress against a job timeout, not the publish,
              # so a failure here must not kill the pass loop. But a
              # FAILED rebase must still be aborted -- left in place it
              # stops the repo mid-rebase and the next pass's commit and
              # push behave unpredictably against a half-applied tree.
              git pull --rebase origin main || git rebase --abort || true
              git push || true
              echo "pass $i died; cooling down 240s"
              sleep 240
            done
            [ "$ok" = "1" ]
          else
            # THE NIGHTLY PATH, BOUNDED SEPARATELY FROM THE BACKFILL.
            # The NGram healer above is the one acquisition boundary. Running
            # run_daily online here used to open a second GDELT DOC 14-day-tail
            # fetch after the store was already healed. On daily #114 it spent
            # the entire 30-minute bound there and produced nothing. It could
            # also overwrite NGram-regime tail cells with a different source
            # regime. Offline mode consumes the exact healed store and committed
            # market cache; the backfill branch above remains deliberately live.
            #
            # Measured pre-fix incremental runs: 11.6 (#102), 13.8 (#95), 17.5
            # (#97), 20.7 (#99) minutes. The bound remains until post-fix
            # telemetry justifies lowering it; never remove the bound by feel.
            # Failing here is strictly better than hanging: the job's
            # concurrency lane is released, so the 06:21 or 20:53 backup
            # cron gets to try instead of queueing behind a corpse.
            if [ "${{ steps.final_source.outcome }}" != "success" ]; then
              echo "exact frozen-target acquisition did not close; refusing pipeline"
              exit 1
            fi
            # NOTHING TO PUBLISH IS NOT A FAILURE.
            #
            # morning.yml publishes the 06:00 contract. When it succeeds --
            # which is the normal case -- the newest closed day is already
            # published by the time this lane reaches here. run_daily then
            # calls require_ordered_target, which demands the exact next
            # UNPUBLISHED day before UTC D0, gets none, and raises
            # final_target_invalid.
            #
            # That failure skipped the 27 steps below it, including the
            # derived lanes, the freshness audit and the universal _meta
            # stamp. So the lane whose job is to refresh the derived plane
            # died before refreshing it, every day the contract lane worked,
            # and 37 payloads went stale on the live site while the index
            # itself was perfectly current.
            #
            # This is the same shape as the deadlock recorded at the top of
            # this file -- the live freshness test failing HERE and killing
            # the lane before it could refresh the payloads it was
            # complaining about -- recurring behind a different gate.
            #
            # --target is now the value require_ordered_target actually
            # demands rather than a blind D-1. When they agree, behaviour is
            # unchanged; when they differ, D-1 could only ever have failed,
            # and this walks a backlog forward one ordered day at a time.
            NEXT=$(python -m src.final_publication --next-target \
                     --today "${{ steps.final_contract.outputs.today }}")
            if [ "$NEXT" = "none" ]; then
              echo "no unpublished day before UTC D0; the contract lane has"
              echo "already published it. Skipping the publish and continuing"
              echo "to the derived lanes, which are this lane's other job."
              # But NOT skipping the event study, which is not part of the
              # publish and was only ever reached as a side effect of it.
              # morning.yml runs run_daily --final-only, which prints
              # "[4/5] Event study unchanged" and skips it; this lane ran
              # it only on the branch that publishes a day. So on every
              # day the 06:00 contract SUCCEEDED -- the good case --
              # nothing recomputed event_study.json, and it sat 8 days old
              # with both lanes green.
              #
              # --derived-only takes no target and touches none of the
              # publication guards. It re-reads the committed store and
              # rewrites one payload. Not fatal to the run: a failure here
              # must not cost the derived lanes below, which is the
              # ordering mistake this file has already paid for twice
              # tonight.
              # NO IGRM_OFFLINE here, unlike every other run_daily call in
              # this file, and the difference is the whole reason the step
              # works. data/raw/prices.csv and derived_returns.csv are
              # GITIGNORED -- Yahoo-derived, never committed -- so they do
              # not exist on a fresh runner. With IGRM_OFFLINE set,
              # fetch_markets.load_or_update raises
              # OfflineMarketDataUnavailable rather than fetching, and this
              # step would fail on every run while looking like a fix.
              # (Written that way first; caught by checking whether the
              # file it depends on is tracked, which it is not.)
              #
              # Dropping the flag is safe HERE and only here: --derived-only
              # reads the GDELT store with pd.read_csv and never calls
              # fetch_gdelt, so the only fetch it enables is the market one
              # it needs. On the publish branch below IGRM_OFFLINE is load
              # bearing for GDELT determinism and must stay.
              timeout 20m python -m src.run_daily --derived-only \
                || echo "::warning::event study refresh failed; continuing to the derived lanes"
            else
              IGRM_OFFLINE=1 timeout 30m python -m src.run_daily \
                --target "$NEXT" \
                --contract-today "${{ steps.final_contract.outputs.today }}"
            fi
          fi
      - name: Global Event and Episode Ledger (aggregate observation foundation)
        if: github.event.inputs.backfill != 'true'
        # Events v1 is an auxiliary context lane. A failed candidate refresh
        # retains the last value-safe public status/release and cannot suppress
        # the core press-salience publication.
        continue-on-error: true
        timeout-minutes: 5
        run: python -m src.event_ledger
      - name: Refresh the measured Continuous Evolution capability ledger
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 5
        run: python -m src.evolution_engine --write
      # Precision-v3 frame recording remains dormant while retained NGram
      # identities lack a current signed processing decision. The CLI itself
      # also refuses before reading cache bytes; a daily workflow must not turn
      # a rights refusal into either a failed-frame record or an implicit pass.
      - name: China monitor (V8; registered 2026-08-06, resumes from chunk cache)
        # Runner IPs are clean where the laptop's got heated; the
        # settled-chunk cache carries backfill progress across runs, so
        # each attempt banks more history until the store completes.
        if: github.event.inputs.backfill != 'true'
        id: china
        continue-on-error: true
        timeout-minutes: 30
        run: python -m src.country_monitor china --deadline-seconds 1500
      - name: China lane has produced nothing at all, and that is not a success
        # V8 is registered in countries/china.json, wired here, and has
        # never written docs/data/country_china.json -- data/raw holds no
        # china store either. Every failed collection has looked like a
        # successful run, because continue-on-error above discards the
        # outcome. Exactly the laundering that hid V5 for a week.
        #
        # continue-on-error stays: a throttled China collection must not
        # stop the publish. But once the payload exists, a later failure
        # is a partial-progress problem the store absorbs, so this only
        # fires while the lane has produced NOTHING.
        if: always()
        run: |
          if [ -f docs/data/country_china.json ]; then
            echo "china payload exists; partial failures are absorbed by the store"
            exit 0
          fi
          if [ "${{ steps.china.outcome }}" = "failure" ]; then
            echo "::error::V8 China has never produced country_china.json and" \
                 "this collection failed too. The lane is stalled, not slow."
            exit 1
          fi
          echo "china payload still absent but the step did not error; not flagging"
      - name: Measured sector sensitivities (E2; signed mapping v1.1.0)
        # After the pipeline so episodes.json is fresh. Yahoo prices
        # fetched, used, never committed; only aggregates publish.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.sector_sensitivity
      # uncertainty.json is a frozen 2026-06-30..2026-08-07 study. Rebuilding
      # it reads retained identity-bearing caches and stays disabled until a
      # current signed decision covers the complete historical window.
      - name: Receipts at scoring depth (bounded daily evidence scan)
        # Runs after the pipeline step so latest.json already carries
        # today's date -- otherwise this would publish receipts one day
        # stale, for the score the site showed yesterday. This required
        # lane re-scans the same ~48 half-hourly NGrams files the score
        # used and publishes bounded, lane-labelled representatives. The
        # every-available-file enrichment remains intact in the separate
        # receipts-extended workflow; its much larger network budget can
        # no longer hold the atomic daily publication hostage. On a feed
        # gap the module falls back to bounded artlist evidence and
        # _meta.method says which lane produced it.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        # 32, not 25. Measured on run 32326976462: the step used 1236s of
        # its 1500s ceiling (600s scan + 636s for the four siblings), so
        # the larger scan budget below does not fit under 25 minutes.
        timeout-minutes: 32
        env:
          # 900, not 600. THE SCAN NEVER COMPLETED A SINGLE DAY.
          #
          # The standard scan needs 48 half-hourly windows
          # (fetch_ngrams.SAMPLES_PER_DAY). A 600s budget bought 38-45 of
          # them -- measured across every committed cache:
          # 2026-08-15 complete=False n_samples=38, 2026-08-18 39,
          # 2026-08-19 43. Never 48, not once.
          #
          # receipts_ngrams refuses to publish a partial corpus (an
          # incomplete denominator would turn runner timing into an
          # undocumented sampling rule), so docs/data/receipts.json has
          # been frozen at 2026-08-07 ever since -- the last stale payload
          # on the live site after the 2026-08-19/20 heal.
          #
          # The resume cache was added so "progress survives the axe to
          # converge". It cannot converge here: convergence needs a SECOND
          # pass at the same day, and this lane runs once per day while
          # latest.json advances every morning. Each day's partial scan is
          # therefore abandoned at 38-45/48 and the next day starts at
          # zero. A budget below the day's size is not a slow scan, it is
          # a scan that never finishes.
          #
          # Worst observed rate is 38 files / 600s = 15.8 s/file, so 48
          # files need ~758s; 900 carries margin for a slower feed. The
          # resume cache stays as insurance for a genuinely slow day.
          IGRM_RECEIPTS_DEADLINE_S: "900"
        run: |
          # receipts_ngrams banks progress and exits 1 while a backlog scan
          # is incomplete -- a DESIGNED refusal that recurs every run during
          # catch-up. Under bash -e it ended this block and starved the four
          # sibling lanes for the whole catch-up window (measured 2026-08-19:
          # receipts_archive, episode_terms, spike_breadth and syndication
          # all 12 days stale while ngrams banked its 2026-08-18 scan). Same
          # shape as the nine derived lanes split out below. Every sibling
          # runs; the step still exits with the last refusal, so the log
          # stays honest about incomplete catch-up.
          rc=0
          python -m src.receipts_ngrams || rc=$?
          python -m src.receipts_archive || rc=$?
          python -m src.episode_attribution || rc=$?
          python -m src.spike_breadth || rc=$?
          python -m src.syndication || rc=$?
          exit "$rc"
      - name: Derived lanes (recompute from the committed stores)
        # A SEPARATE STEP on purpose. GitHub runs `run:` blocks under
        # bash -e, so the first failing command ends the block -- and
        # these nine lanes were briefly appended to the receipts step
        # above, where one network hiccup in receipts_ngrams would have
        # skipped every one of them while continue-on-error kept the run
        # green. Precisely the silent-failure shape this whole day has
        # been about, introduced by me while fixing others.
        #
        # Nothing here touches the network: these read the committed
        # stores, so they must not share a fate with the lane that does.
        #
        # ORDER IS LOAD-BEARING. provenance builds the instrument record
        # from the store; publish_shares needs it for the source column;
        # monthly reads the shares CSV publish_shares writes. Out of
        # order, each quietly consumes yesterday's version of the last.
        #
        # publish_shares was in NO workflow until 2026-08-07: shares.csv
        # shipped as the "first-class artifact" answering the referee,
        # was written once by hand, and would have frozen on 2026-08-06
        # while the site advertised it as the daily quantity.
        # episode_actors, exposure and predictability were orphaned the
        # same way.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python -m src.provenance
          python -m src.publish_shares
          # splice_sensitivity.json is a frozen historical study. Rebuilding it
          # reads retained identity-bearing NGram evidence and remains refused
          # until the source has a current signed decision for that use.
          python -m src.monthly
          python -m src.blind_spot
          python -m src.detection_baselines
          python -m src.negative_results
          python -m src.episode_actors
          python -m src.exposure
          python -m src.predictability
          python -m src.outlet_drift
          # assistant_answers is NOT here. It records a source_sha256 for
          # every fact it cites, so it must run after the last module that
          # rewrites a payload it reads -- which is stamp_meta, further
          # down. See the step "Machine answers (after the stamps)".
      - name: Blind replication (fail-loud; the codebook must still be enough)
        # NOT continue-on-error, and deliberately NOT in morning.yml --
        # same placement as freshness and vintages. This rebuilds the
        # published series from the published codebook and the published
        # shares, with no access to src/, and requires an EXACT match.
        #
        # It goes red in exactly two situations, and both are things
        # somebody has to hear about: the pipeline changed without the
        # codebook changing, or the codebook was never sufficient. A
        # replication that is allowed to degrade quietly is not a check,
        # it is a badge.
        #
        # Must run after publish_shares (it reads shares.csv) and before
        # stamp_meta. --check --write validates the entire published-cell
        # denominator first, then refreshes replication.json only on success.
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 10
        run: python -m src.blind_replicator --check --write
      - name: Cross-language validity (V5-adjacent; Wikimedia API)
        # Its own step because it is the only remaining network call in
        # this group, and a Wikimedia outage must not cost the derived
        # lanes above or the audits below.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: python -m src.wiki_hindi
      - name: Vintage tripwire (published history must not be rewritten)
        # Deliberately NOT continue-on-error, and deliberately its own
        # step: this is the one check whose whole value is that it can
        # fail the run. Every other lane above is enrichment, and a
        # missing enrichment is a smaller harm than a red morning. A
        # silently rewritten history is not -- it invalidates every
        # result anyone has published from this series, so it stops the
        # build and says so.
        #
        # It lives HERE and not in morning.yml on purpose. load_or_update
        # refetches a 14-day tail and lets fresh values win, so a GDELT
        # revision of a recent day could legitimately trip this. That is
        # information worth having -- adopting an upstream revision
        # silently is exactly the thing being guarded against -- but it
        # must not be able to block the 06:00 contract. Red enrichment
        # lane, published morning: the failure lands where it can be
        # read without costing the promise.
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 10
        run: |
          python -m src.vintages
          python -m src.vintages_panel
      - name: Machine-brief safety withdrawal check
        # Generated prose was withdrawn 2026-08-08 after factual-grounding
        # failures. This module has no model-call or payload-write branch;
        # the stable API path serves a fixed null tombstone instead.
        if: github.event.inputs.backfill != 'true'
        run: python -m src.daily_brief
      - name: Machine aptness pre-filter (founder-approved 2026-08-06)
        # Labels receipts articles ON/OFF/ABSTAIN under the registered
        # rubric; display-layer only (OFF collapses with a visible
        # count, scores untouched); founder rulings audit the machine
        # and the agreement rate publishes with the payload. Fail-closed
        # without the key: the site shows unfiltered receipts.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.aptness
      - name: Tone second axis (G1; annotates matched articles by URL)
        # After receipts so the day cache is fresh. Construction-
        # identical: the registered dictionaries choose the articles,
        # BigQuery only annotates their V2Tone. Fail-closed without
        # the GCP secrets; capped bytes per query inside the module.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # NO --quiet, and constrained. Both changed on 2026-08-18
          # after this step broke the publish.
          #
          # This is the SECOND pip install in the lane, after the pinned
          # one at the top, and pip may upgrade an already-installed
          # package to satisfy a new one. It did: run 32090616610
          # finished all 48 steps and then refused at the publish gate
          # with "environment differs from committed pins:
          # requests==2.34.2 installed (expected 2.32.5)". The check was
          # right -- the lane had quietly stopped being the environment
          # CI tested.
          #
          # WHICH transitive dependency forced it is not in the log,
          # because --quiet suppressed the resolution. It is the only
          # pip that ran between the pinned install and the failing
          # check, so it is the cause; the chain is unproven and --quiet
          # is why. Hence dropping it: a step that mutates the
          # environment should say what it changed.
          #
          # Constraints make the pins win. If google-cloud-bigquery
          # genuinely cannot resolve against them, this install FAILS
          # here rather than succeeding and breaking the publish forty
          # minutes later. The step is continue-on-error, so that trade
          # is the right way round: the tone annotation is optional, the
          # publish is not.
          pip install google-cloud-bigquery \
            -c requirements.txt -c requirements-dev.txt
          python -m src.fetch_tone
          python -m src.fetch_themes
      - name: V11 forecast experiment (registration signed 2026-08-06)
        # Generates next Monday's questions (committed before the
        # window opens, or void by rule) and grades matured windows
        # mechanically. Research-page separation enforced by test.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.forecasts
      - name: Alerts Phase 0 (registered triggers, founder-signed 2026-08-06)
        # After reliability/status so T3 reads the fresh contract
        # record. Computes only from published payloads; an alert can
        # never disagree with the site.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: python -m src.alerts
      - name: Self-heal stalled multilingual backfill (V5)
        # 2026-08-02: the chain's own two scheduled crons never fired even
        # once in their first ~17 hours live (only the original manual
        # push-trigger run exists), so it cannot be trusted alone to
        # restart itself in quiet hours. This job runs reliably three
        # times a day regardless, so it re-touches the trigger file
        # whenever the store is still missing and the last kick is stale
        # -- cheap because .trigger/multilingual is a one-line timestamp,
        # and self-limiting because the guard clears once
        # multilingual_salience.csv lands.
        if: always()
        run: |
          if [ ! -f data/raw/multilingual_salience.csv ]; then
            LAST=$(cat .trigger/multilingual 2>/dev/null || echo "1970-01-01T00:00:00Z")
            LAST_EPOCH=$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            AGE_H=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))
            if [ "$AGE_H" -ge 6 ]; then
              echo "multilingual store missing, last kick ${AGE_H}h ago; re-triggering"
              date -u +%Y-%m-%dT%H:%M:%SZ > .trigger/multilingual
            else
              echo "multilingual store missing but last kick only ${AGE_H}h ago; leaving it to run"
            fi
          fi
      - name: Expert attention shelf (practitioner item 3; RSS titles only)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.expert_attention
      - name: Precision audit sample (labels applied by the nightly agent run)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        run: python -m src.precision_auditor --sample --publish
      - name: Reliability record from git evidence
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        run: python scripts/build_reliability.py
      - name: Per-sector feeds (E4; re-cut of published payloads only)
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: python -m src.sector_feeds
      - name: Status payload (M4; derives from committed files only)
        # After reliability so the contract summary is current. The
        # module never fetches anything; a missing store shows as a
        # rule-computed "no" with its note, not a crash.
        if: github.event.inputs.backfill != 'true'
        continue-on-error: true
        run: python -m src.status_data --contract-today "${{ steps.final_contract.outputs.today }}"
      - name: Regenerate sitemap from the pages that exist
        # It was hand-maintained and had drifted to 16 urls against 26
        # pages -- start.html and the 41-year series among the missing.
        # Derived now, so a new page is crawlable the day it ships.
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 5
        run: python -m src.sitemap
      - name: Stamp universal _meta on every payload (licence, citation, codebook, source)
        # LAST payload writer in the lane, deliberately. This step was
        # first placed mid-workflow, then after the audits, and both
        # times a later lane rewrote a payload without the stamp --
        # nowcast, then vintages, then the twelve lanes that run after
        # the tripwire. Stamping is only meaningful after everything
        # that writes has written, so it sits immediately before the
        # dual-computation audit and the commit.
        #
        # Modules that write after their own last chance (freshness,
        # vintages, nowcast) also carry the fields themselves, so the
        # guarantee does not rest on this step's position alone.
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 5
        run: python -m src.stamp_meta
      - name: Stamp asset cache-busting versions (content-derived)
        # Same reason and same position as the step above, for the other
        # kind of stamp. render_site.py emits `href="site.css"` with no
        # version at all, so every page it regenerates nightly arrives
        # unversioned -- and a returning reader keeps whatever CSS they
        # first saw. Worse, tokens.css was @imported with no version by
        # BOTH sheets, so a new stylesheet could land against a cached
        # token file; an undefined custom property does not fall back,
        # the whole declaration is dropped.
        #
        # Must run after every module that writes HTML (render_site,
        # build_index, permanence, stamp_meta) and before the commit.
        # test_asset_versions.py checks that position against the
        # workflow's real order rather than trusting this comment.
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 5
        run: python -m src.stamp_assets
      - name: Machine answers (after the stamps, because they cite hashes)
        # ORDER IS LOAD-BEARING, AND WAS WRONG.
        # assistant_answers records a source_sha256 for every fact it
        # cites. build_index writes latest.json with a _meta carrying
        # what/units/license/citation/codebook/generated -- but not
        # `source`. stamp_meta adds `source`. So generating the answers
        # BEFORE the stamp records a hash of a file that no longer exists
        # by the time the run commits, and
        # test_the_payload_is_exactly_what_the_assistant_answers refuses
        # the publish.
        #
        # Reproduced 2026-08-09 by removing _meta.source from
        # latest.json and running the two orders against each other:
        # answers-then-stamp fails, stamp-then-answers passes. morning.yml
        # runs them in the correct order; this lane did not.
        #
        # Only assistant_answers moves. status_data reads the same
        # payloads but records no hash of them (0 occurrences of sha256
        # in src/status_data.py), so it stays where it is rather than
        # running twice for a reason that does not apply to it.
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 5
        run: python -m src.assistant_answers
      - name: Dual-computation audit (fail-loud; two derivations must agree)
        if: github.event.inputs.backfill != 'true'
        run: python -m src.audit
      - name: Weekly datapack (Fridays)
        # Any successful Friday run makes the datapack: a manually
        # triggered rescue run must not cost the author the week's note
        # material (2026-07-31: a push-triggered run skipped it).
        if: github.event.inputs.backfill != 'true'
        run: |
          if [ "$(date -u +%u)" = "5" ]; then python -m src.make_datapack; fi
      - name: Freshness report (the payload; the verdict runs after the commit)
        run: |
          # One module, two jobs, split across the commit. --report WRITES
          # docs/data/freshness.json and exits 0 regardless of staleness,
          # so the report the site serves is regenerated in the same
          # candidate as the payloads it describes. The fail-loud VERDICT
          # (same module, no flag) stays below Commit data, where a red
          # cannot discard the commit. When the audit moved below the
          # commit on 2026-08-17 it silently took the writer with it:
          # runs 32280274391 and 32267252818 published 87-file commits
          # while freshness.json stayed at its 2026-08-10 bytes, because
          # the regenerated report was written on a runner that was about
          # to be thrown away. The site then served a nine-day-old claim
          # of "0 stale of 94" under fresh payloads.
          python -m src.freshness --report
      - name: Commit data
        # always(): a crash must still bank acquisition caches and byte-exact
        # source evidence. Derived docs are staged only if every required step
        # succeeded; a late failure therefore cannot publish a mixed vintage.
        if: always()
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          # .gitignore excludes Yahoo-derived prices.csv / derived_returns.csv;
          # only the GDELT store persists (backfill is expensive to redo).
          # docs/ also carries rendered pages (methodology.html, feed.xml,
          # notes.json) produced by the publish step.
          # events_*.csv are excluded while the backfill chain owns them:
          # Events files are committed again as of 2026-08-02: the
          # backfill chain that owned them finished on 2026-07-31, and
          # the exclusion had begun publishing map aggregates that the
          # committed store could not reproduce (caught by the first
          # run of src.audit; corrections ledger entry the same day).
          bash scripts/stage_daily_outputs.sh \
            "${{ job.status }}" "${{ steps.final_contract.outputs.target }}"
          bash scripts/publish_push.sh "data: update $(date -u +%F)"
      # MOVED AGAIN, BELOW Commit data (2026-08-17, same day as the first
      # move). Placing it above the commit was still wrong, for a reason
      # the first move did not fix: this step is fail-loud, and
      # 'Commit data' refuses every derived docs change when the job has
      # already failed. Run 32043239556 proved it -- all 48 steps ran, the
      # derived lanes refreshed the plane from 36 stale payloads to 9, this
      # audit then failed on the 9 that no daily lane can refresh, and the
      # commit discarded all 27 refreshed payloads. The tree was left dirty,
      # so the publish step's rebase refused too.
      #
      # Auditing staleness must not be able to destroy the work that cures
      # staleness. Commit first, then report on what was committed -- which
      # is also the only ordering under which the verdict describes the
      # published state rather than a working tree nobody will keep.
      - name: Freshness audit (every payload, not just the ten tracked sources)
        # MOVED 2026-08-17, and the move is the point.
        #
        # This step's comment claimed it 'runs last among the enrichment
        # lanes, so it audits what this run actually produced'. That was
        # true when written and had quietly stopped being true: steps kept
        # being appended after it -- tone, aptness, forecasts, alerts,
        # episode themes, the expert shelf, the precision auditor, the
        # per-sector feeds, status -- so it audited payloads that this run
        # had not written yet, and failed the lane on their staleness.
        #
        # Being fail-loud, it then skipped the 18 steps below it, INCLUDING
        # the writers whose output it had just called stale. Run
        # 31979586398: 33 payloads reported stale, at least 25 of them
        # written by steps after this one. The audit was the reason its own
        # complaint stayed true.
        #
        # Now genuinely last: after the machine answers, the dual-
        # computation audit and the datapack, immediately before the
        # commit. Safe after the _meta stamp because stamp_file only fills
        # license/citation/codebook/source and never overwrites -- it does
        # not touch _meta.generated, so it cannot make a stale payload read
        # as fresh.
        #
        # Fail-loud is retained deliberately: a stale payload does not
        # break, it keeps serving its last value and gets quoted as
        # confidently as a fresh one. Two lanes (China, V5) failed silently
        # for days and both were caught by accident. Nothing of value runs
        # after this step now, so failing here suppresses no other check.
        #
        # In the enrichment lane, never the contract lane: a staleness
        # report must not be able to stop the 06:00 publish.
        if: github.event.inputs.backfill != 'true'
        timeout-minutes: 5
        run: python -m src.freshness
