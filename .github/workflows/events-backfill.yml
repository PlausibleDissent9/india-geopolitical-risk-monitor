name: events-backfill

# Walks the GDELT Events v1 daily archive back to 2017-01-01 in batches,
# committing the store after each batch and re-triggering itself until no
# days are missing. Static file downloads (no API rate limiter), so the
# only budget concern is runner time; ~450 days a batch keeps runs near
# an hour. Re-triggers ONLY when a batch made progress, so a persistent
# upstream failure stops the chain instead of looping it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".trigger/events_backfill"]

permissions:
  contents: write
  # actions:write lets the chain re-trigger itself through the dispatch
  # API; plain GITHUB_TOKEN pushes never fire push-triggered workflows.
  actions: write

concurrency:
  # Scoped by ref: an unscoped group lets a Dependabot PR branch's push
  # event queue a run in the same lane as main and starve it
  # (2026-08-02, see daily.yml for the mechanism).
  group: igrm-events-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Count missing days before
        id: before
        # Progress means the incomplete-day count fell, NOT that the
        # national store grew: a batch that reprocesses days predating
        # the dyad/state layers grows only those two files, and a line
        # count of events_daily.csv read that real progress as none and
        # ended the chain (2026-07-31, run 30636353123).
        run: |
          M=$(python -c "from src.fetch_events import _missing_days; print(len(_missing_days()))")
          echo "missing=$M" >> "$GITHUB_OUTPUT"
      - name: Fetch a batch (oldest missing first)
        continue-on-error: true
        timeout-minutes: 120
        run: python -m src.fetch_events --backfill 450
      - name: Commit progress
        id: commit
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add data/raw/events_daily.csv data/raw/events_dyads.csv data/raw/events_states.csv || true
          bash scripts/publish_push.sh "events backfill batch: $(date -u +%FT%TZ)"
          M=$(python -c "from src.fetch_events import _missing_days; print(len(_missing_days()))")
          echo "missing=$M" >> "$GITHUB_OUTPUT"
      - name: Re-trigger while incomplete and progressing
        run: |
          BEFORE="${{ steps.before.outputs.missing }}"
          AFTER="${{ steps.commit.outputs.missing }}"
          echo "incomplete days: $BEFORE -> $AFTER"
          if [ "$AFTER" -gt 0 ] && [ "$AFTER" -lt "$BEFORE" ]; then
            # A trigger-file commit pushed with GITHUB_TOKEN never fires
            # the push trigger (GitHub's recursion guard), which silently
            # ended the chain on 2026-07-31 with 3496 days still missing.
            # Dispatch events are the documented exception to that guard,
            # so the chain continues through the API instead.
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/events-backfill.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "dispatched next batch"
          else
            echo "chain ends here"
          fi
