name: receipt-identity

# A small independent evidence surface. Three daily windows, two staggered
# shots each, recover from a transient GDELT failure without rerunning or
# blocking the aggregate score. Pending rights still produce a fresh
# value-free status; no headline can be fetched or released until both the
# source decision and the separate profile carry valid trusted-human
# signatures.
on:
  workflow_dispatch:
  schedule:
    # Paired shots per window: GitHub silently drops single scheduled
    # events under congestion (2026-08-16 the lone 07:07 IST shot was
    # never created and the day's articles stayed stale until 13:07).
    # Every run is independently bounded by the signed profile's exact
    # 7-request budget with monotone same-target retention, so a
    # redundant shot republishes the same closed payload or improves it.
    - cron: "37 1 * * *"   # 07:07 IST
    - cron: "53 1 * * *"   # 07:23 IST paired drop-insurance shot
    - cron: "37 7 * * *"   # 13:07 IST retry
    - cron: "53 7 * * *"   # 13:23 IST paired drop-insurance shot
    - cron: "37 13 * * *"  # 19:07 IST retry
    - cron: "53 13 * * *"  # 19:23 IST paired drop-insurance shot

permissions:
  contents: write

concurrency:
  group: igrm-receipt-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CURRENT tip, not github.sha. A scheduled event pins the
          # sha at event creation; the paired drop-insurance shot then
          # queues behind its partner in the concurrency group and, on
          # 2026-08-18 (runs 32146591496/32147480729), started 5 seconds
          # after the partner's release landed -- and built on the
          # pre-release sha anyway. Its stale predecessor binding was
          # then correctly refused at release, five times, red.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Build exact completed D-1 identity status or source links
        id: acquire
        continue-on-error: true
        timeout-minutes: 15
        run: python -m src.receipt_identity
      - name: Verify fresh closed payload
        run: |
          TARGET=$(date -u -d "$(date -u +%F) - 1 day" +%F)
          python -m src.receipt_identity --verify-payload --expected-target "$TARGET"
      - name: Stamp universal metadata and asset versions
        run: |
          python -m src.stamp_meta
          python -m src.stamp_assets
      - name: Publish independently of aggregate score
        id: release
        continue-on-error: true
        env:
          IGRM_PUBLISH_CLASS: receipt_identity
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add -- docs/data/receipt_identity.json
          bash scripts/publish_push.sh "receipts: D-1 identity status $(date -u +%F)"
      - name: A superseded release is the drop insurance succeeding
        if: steps.release.outcome == 'failure'
        run: |
          # State-based, not error-code-based: this run turns green only
          # if fetched origin/main already retains, channel by channel,
          # every article this run closed for the same target. A red
          # gate, a lost payload, or a remote missing local evidence
          # still fails. See verify_superseded in src/receipt_identity.
          git fetch origin main
          TARGET=$(date -u -d "$(date -u +%F) - 1 day" +%F)
          python -m src.receipt_identity --verify-superseded \
            --expected-target "$TARGET"
