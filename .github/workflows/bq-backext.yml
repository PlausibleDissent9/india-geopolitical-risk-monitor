name: bq-backext
# M1 one-shot: build the 1979-2019 monthly store (capped bytes), then
# grade the frozen anchors and run the overlap audit, committing both.
# Fires when this file changes or on dispatch; the store commits once
# and the module never re-queries an existing store.
on:
  push:
    branches: [main]
    paths: [".github/workflows/bq-backext.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backext:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt google-cloud-bigquery db-dtypes
      - env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        continue-on-error: true
        run: |
          set -o pipefail
          {
            if [ -f data/raw/back_extension_monthly.csv ]; then
              echo "store exists; publish only"
              python -m src.back_extension --publish
            else
              python -m src.back_extension --build --publish
            fi
          } 2>&1 | tee backext.log || {
            echo "== backext run $(date -u) FAILED ==" > analysis/backext_run_log.md
            tail -30 backext.log >> analysis/backext_run_log.md
          }
      - name: Stamp payload metadata and asset versions
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta || true
          python -m src.stamp_assets || true
      - name: Commit store + payload
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add data/raw/back_extension_monthly.csv docs/data/back_extension.json analysis/backext_run_log.md 2>/dev/null || git add analysis/backext_run_log.md
          bash scripts/publish_push.sh "back-extension: M1 store + graded anchors $(date -u +%F)"
# run-stamp: 2026-08-06T11:37:27Z cap sized to measured 22.25GB need
