name: publish-lane environment

# The publishing lanes once installed runtime requirements alone and then ran
# tests that depended on development tooling. That made ordinary CI green and
# the lane that actually publishes red. Every publisher now installs both
# exact requirement sets, and src.security_integrity verifies the invariant
# across the complete workflow directory. This separate workflow proves the
# resulting clean environment, without rerunning the full suite twice.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publisher-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publisher gates resolve frozen historical registrations.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Clean publisher environment matches exact pins
        run: python scripts/check_environment.py
      - name: Every publisher retains environment parity and fail-closed controls
        run: python -m src.security_integrity --check
