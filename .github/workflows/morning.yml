name: morning-contract

# The 06:00 IST contract lane. The full daily pipeline takes 40+ minutes
# (receipts alone is capped at 25), which cannot fit the contract window:
# the measured UTC day closes at 05:30 IST (00:00 UTC) and the final is
# promised by 06:00 IST (00:30 UTC). This lane publishes ONLY the final
# index -- heal, pipeline, audit, reliability, push -- in ~5 minutes, and
# leaves receipts/events/maps/comparators enrichment to the full daily
# runs later in the day, which overwrite nothing the final depends on.
#
# Why three cron entries: GitHub drops scheduled events under congestion,
# and 00:00-01:00 UTC is the worst window of the day. 2026-08-03/04
# overnight it dropped FOUR consecutive events in this repo (daily's
# 00:07 and 00:51, nowcast's 00:43 and 02:43) -- the contract missed not
# because any run failed but because no run was ever created. Multiple
# staggered odd-minute shots plus the nowcast guarantor (which now
# dispatches this lane, fail-loud) is the maximum redundancy available
# without external infrastructure. If GitHub suspends all scheduling for
# hours, the miss is recorded honestly by scripts/build_reliability.py;
# that ledger is part of the product.

on:
  schedule:
    # A 05:15 IST early shot stood here for half a day and was wrong:
    # the measured UTC day closes at 05:30 IST, so a shot before that
    # cannot heal the contract's target day (heal refuses days newer
    # than today-1) and only squats on the shared lane with a 35-minute
    # cap while the valid shots queue. Caught in external review before
    # it ever fired. Margin against scheduler congestion comes from the
    # push trigger below, which is not subject to cron congestion.
    - cron: "3 0 * * *"     # 05:33 IST -- first valid shot (day closes 05:30)
    - cron: "17 0 * * *"    # 05:47 IST -- second shot
    - cron: "29 0 * * *"    # 05:59 IST -- last shot inside the window
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".trigger/morning"
    # The scheduler-independent path. On 2026-08-08 GitHub fired all
    # three crons 82+ minutes late and the 06:00 contract was missed
    # with every shot accounted for -- cron here is best-effort by
    # design and no shot count fixes that. A push to .trigger/morning
    # starts this lane within seconds of the push, so any agent with
    # push access (the resident machine checks at 05:40 IST) can fire
    # the morning when the scheduler has not. The idempotence guard
    # makes a redundant trigger a no-op, same as a redundant cron shot.

permissions:
  contents: write
  actions: write

# Same lane as the full daily pipeline: these two workflows push the same
# files and must queue, never race. Concurrency groups are repo-wide, so
# sharing daily.yml's group name serializes them.
concurrency:
  group: igrm-pipeline-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-latest
    # 20 was calibrated for an on-time shot. On 2026-08-08 GitHub fired
    # all three crons 82+ minutes late and the single surviving shot was
    # killed BY THIS LINE at 20m15s, mid-pipeline under GDELT throttle --
    # congestion plus throttle plus a tight cap is three failures where
    # any two would have been survivable. The cap exists so a hung shot
    # cannot block the daily lane's concurrency slot.
    #
    # 35 was then killed by this line in turn, on 2026-08-09 at 35m12s,
    # and the arithmetic says it always would be. What the cap has to
    # cover was re-derived from the two runs that morning rather than
    # from the previous estimate:
    #
    #   heal (--heal 5)          11.0 - 11.1 min   measured #26, #27
    #   pipeline (run_daily)     14.9 - 20.8 min   measured #27, #26
    #   gate inside the push     ~5.2 min          gate.sh --committed
    #   commit / rebase / push   ~1 min
    #                            ---------------
    #   worst observed            ~38 min against a 35-minute cap
    #
    # The gate term is the one nobody re-derived: the generic publisher runs
    # scripts/gate.sh --committed inside the push step, so since
    # gate_candidate landed EVERY lane's cap has had to cover a full CI
    # gate on top of that lane's own work. Nine lanes call it. #26 spent
    # 31.8 minutes in heal and pipeline alone and was axed during the
    # push with the gate still running -- not bad luck, no headroom.
    #
    # 45, not 50: a 05:33 shot then ends by 06:18 and still clears the
    # 06:21 daily cron, which is the property the cap exists to protect.
    #
    # 2026-08-10: THE GATE TERM MOVED AGAIN, and 45 no longer covers it.
    # Measured, rather than estimated:
    #
    #   gate.sh --committed, this laptop        7m32s
    #   multilingual-backfill #78 "Commit
    #     progress" on a hosted runner, GREEN   24.1 min
    #   nowcast #79 killed at its 30-min cap
    #     with 19.8 min inside the same step
    #
    # A 2-core hosted runner is roughly 2.5-3x this laptop on a CPU-bound
    # pytest, so ~20 minutes is ONE gate, not a retry storm. The suite grew
    # today -- scenario proof, n-ary trace, page anchors, no-JS,
    # cross-runtime parity, analytical clause -- and every lane that calls
    # every publishing lane pays the whole of it inside its own cap.
    #
    #   heal (--heal 5)          11.0 - 11.1 min   measured #26, #27
    #   pipeline (run_daily)     14.9 - 20.8 min   measured #27, #26
    #   gate inside the push     ~20 min           measured tonight
    #   commit / rebase / push   ~1 min
    #                            ---------------
    #   worst case                ~53 min against a 45-minute cap
    #
    # 60. That breaks the 06:18 property, and the trade is deliberate: a
    # 05:33 shot may now still be running when the 06:21 daily cron fires.
    # It does not race it -- both workflows share the igrm-pipeline-v3
    # concurrency group with cancel-in-progress: false, so daily QUEUES
    # behind morning and runs immediately after. A daily lane that starts
    # fifteen minutes late is a cost. A morning contract killed mid-push
    # every day is a missed promise, and that is what 45 now buys.
    #
    # The right fix is a cheaper gate, not a bigger cap, and that is not
    # mine to decide alone: the in-lane gate deliberately runs exactly what
    # CI runs, coverage included, because a gate that differs from CI is
    # the defect scripts/gate.sh exists to prevent. Raising the number
    # keeps the promise tonight; someone should decide whether nine lanes
    # each re-running a 20-minute suite is the architecture we want.
    #
    # 60 WAS STILL A GUESS, AND IT FAILED. #38 and #40 both exceeded it.
    # The "~20 min" above was inferred from a commit step that also
    # contained a rebase and a push. The suite's own cost, read off the CI
    # job's "Tests + coverage" step rather than a whole-run duration:
    #
    #   ci #531  67b48ed   13.9 min
    #   ci #532  cf2ee4d0   37.1 min
    #
    # Two CONSECUTIVE commits. One of them added 23 minutes, and
    # --durations puts 96 seconds of it in a single test that recompiles
    # its fixture per adversarial vector. That is reported in
    # .agents/from-claude.md and is not mine to fix.
    #
    #   heal (--heal 5)          11.0 - 11.1 min   measured #26, #27
    #   pipeline (run_daily)     14.9 - 20.8 min   measured #27, #26
    #   gate inside the push     37.1 min          measured ci #532
    #   commit / rebase / push   ~2 min
    #                            ---------------
    #   worst case                ~71 min against a 60-minute cap
    #
    # 90, from that arithmetic plus ~19 minutes of headroom, because the
    # suite has now moved twice in one night and a cap that only just fits
    # is a cap that fails on the next commit.
    #
    # This is the third raise tonight and it should be the last one that
    # works by arithmetic rather than by fixing the cause. If the 96-second
    # test is optimised, the honest move is to bring this number back down
    # rather than keep the headroom and forget why it is here.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Idempotence guard (multiple shots, at most one publish)
        id: guard
        # Two defects fixed 2026-08-08 after external review (Codex
        # stand-in, verified against the code before fixing):
        # 1. STALE CHECKOUT: actions/checkout pins github.sha at trigger
        #    time, so a run that waited in the concurrency queue wakes
        #    with a tree that predates the run it queued behind, decides
        #    "nothing published today", and can replay older derived
        #    state over a newer publish via publish_push's --theirs.
        #    The guard now asks the REMOTE TIP, fetched after the lane
        #    is acquired, never its own checkout.
        # 2. WRONG PREDICATE: _meta.generated is a wall-clock stamp; a
        #    degraded run can stamp today onto stale data and make every
        #    later rescue shot skip. The contract's actual target is the
        #    MEASURED day: latest.date == yesterday (UTC), so the guard
        #    tests that.
        run: |
          CONTRACT_TODAY=$(date -u +%F)
          CEILING=$(date -u -d "$CONTRACT_TODAY - 1 day" +%F)
          git fetch --quiet origin main
          BASE_COMMIT=$(git rev-parse origin/main)
          REMOTE_PARENT=$(mktemp -d)
          REMOTE_ROOT="$REMOTE_PARENT/origin-main"
          git worktree add --quiet --detach "$REMOTE_ROOT" "$BASE_COMMIT"
          TARGET=$(python -m src.final_publication \
            --next-target --today "$CONTRACT_TODAY" --root "$REMOTE_ROOT")
          if [ "$TARGET" = "none" ]; then
            echo "ordered backlog is already complete through $CEILING"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            git worktree remove --force "$REMOTE_ROOT"
            rmdir "$REMOTE_PARENT"
            exit 0
          fi
          # Backlog idempotence belongs to required_next_target above. The
          # published-target proof intentionally remains a current D-1-only
          # contract and is therefore consulted only at the ceiling.
          if [ "$TARGET" = "$CEILING" ] && python -m src.final_publication \
              --check-published-target "$TARGET" \
              --today "$CONTRACT_TODAY" \
              --root "$REMOTE_ROOT"; then
            echo "proof-eligible final for $TARGET already on exact origin/main tree; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "origin/main does not prove exact final target $TARGET; continuing recovery"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          git worktree remove --force "$REMOTE_ROOT"
          rmdir "$REMOTE_PARENT"
          git checkout --detach "$BASE_COMMIT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = "2026-08-09" ]; then
            echo "mode=legacy-verification" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publication" >> "$GITHUB_OUTPUT"
          fi
          echo "contract_today=$CONTRACT_TODAY" >> "$GITHUB_OUTPUT"
          echo "base_commit=$BASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Cheap disjoint preflight (dictionary and frozen calibration only)
        if: steps.guard.outputs.skip != 'true'
        # The exact full CI gate still runs over the final candidate inside
        # publish_push. Running the whole suite here too spent 11-13 hosted
        # minutes before acquisition and repeated the same normative vectors
        # over a pre-candidate SHA. This bounded preflight checks only the two
        # inputs acquisition is about to trust.
        run: python -m pytest -q -m "not live" tests/test_dictionaries.py tests/test_registration_freezes.py
      - name: Acquire immutable exact-target source frame
        id: source
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        # Hosted maximum observed for the same 48-stamp acquisition was
        # 11m13s (#43); 14m adds 2m47s (25%) without consuming the gate's
        # separately declared budget.
        run: |
          if [ "${{ steps.guard.outputs.mode }}" = "legacy-verification" ]; then
            /usr/bin/time -v timeout --signal=TERM 14m python -m src.final_publication \
              --verify-legacy-aggregate
          else
            /usr/bin/time -v timeout --signal=TERM 14m python -m src.final_publication \
              --acquire-target "${{ steps.guard.outputs.target }}" \
              --today "${{ steps.guard.outputs.contract_today }}" \
              --base-commit "${{ steps.guard.outputs.base_commit }}"
          fi
      - name: Run pipeline (final index only)
        id: pipeline
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.mode == 'publication' && steps.source.outcome == 'success'
        continue-on-error: true
        # This lane is store-only: no GDELT or markets acquisition. The exact
        # final-only code path (receipt revalidation, 3,486-row score/episode
        # build, written-target assertion, render, and finalized marker) took
        # 0.687s locally on 2026-08-10 against an isolated eligible 48/48
        # candidate; /usr/bin/time was 1.22s including fixture preparation.
        # Seven minutes leaves a deliberately large hosted-runner margin while
        # keeping the historical 31m05s network pipeline from run #43 outside
        # this recovery authority.
        run: |
          IGRM_OFFLINE=1 /usr/bin/time -v timeout --signal=TERM 7m python -m src.run_daily --final-only \
            --target "${{ steps.guard.outputs.target }}" \
            --contract-today "${{ steps.guard.outputs.contract_today }}"
      - name: Dual-computation audit (fail-loud gate before any push)
        id: audit
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.mode == 'publication' && steps.source.outcome == 'success' && steps.pipeline.outcome == 'success'
        continue-on-error: true
        run: /usr/bin/time -v timeout --signal=TERM 2m python -m src.audit
      - name: Reliability record from git evidence
        if: steps.guard.outputs.skip != 'true' && steps.source.outcome == 'success' && steps.pipeline.outcome == 'success' && steps.audit.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_reliability.py
      - name: Stamp payload metadata and asset versions
        if: steps.guard.outputs.skip != 'true' && steps.source.outcome == 'success' && steps.pipeline.outcome == 'success' && steps.audit.outcome == 'success'
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta || true
          python -m src.stamp_assets || true
      - name: Derived lanes (recompute from the committed stores)
        id: derived
        if: steps.guard.outputs.skip != 'true' && steps.source.outcome == 'success' && steps.pipeline.outcome == 'success' && steps.audit.outcome == 'success'
        continue-on-error: true
        # THE CONTRACT LANE COULD NOT SATISFY ITS OWN GATE WITHOUT THIS.
        #
        # This lane advanced latest.json and regenerated nothing that
        # derives from it. The gate it runs before pushing rebuilds those
        # payloads and compares them against the committed copies --
        # test_assistant_answers rebuilds assistant_answers.json,
        # test_status_alignment recomputes the alignment block,
        # test_monthly rebuilds the monthly view. A candidate carrying a
        # new day and yesterday's derived payloads fails those by
        # construction, so the fallback lane refused every publish it
        # attempted while the daily was down -- exactly when it is the
        # only lane left. 2026-08-09, runs #27 through #34, three days
        # served stale.
        #
        # These are the daily's derived lanes, in the daily's order,
        # which that workflow documents as load-bearing: provenance
        # builds the instrument record, publish_shares needs it for the
        # source column, monthly reads the shares CSV publish_shares
        # writes. Nothing here touches the network -- they read the
        # committed stores -- so they are safe in a lane whose whole job
        # is to publish quickly from what is already banked. The group took
        # 10s in morning #43; a broader daily #102 observation was roughly
        # two minutes.
        #
        # The step outcome is captured so a refusal can publish the disjoint,
        # value-free status candidate. No derived failure becomes authority
        # to publish final values.
        run: |
          # Five minutes covers both the 10s morning #43 observation and the
          # roughly two-minute daily #102 observation with substantial margin.
          /usr/bin/time -v timeout --signal=TERM 5m bash -c '
            set -e
            python -m src.provenance
            python -m src.publish_shares
            # splice_sensitivity.json is frozen; identity-evidence rebuilds
            # remain rights-refused and are not a daily-final prerequisite.
            python -m src.monthly
            python -m src.blind_spot
            python -m src.detection_baselines
            python -m src.negative_results
            python -m src.episode_actors
            python -m src.exposure
            python -m src.predictability
            python -m src.outlet_drift
            python -m src.assistant_answers
            python -m src.status_data --contract-today "${{ steps.guard.outputs.contract_today }}"
            # These four offline registries are checked by the committed CI
            # gate and must be regenerated by the same candidate that changes
            # their source stores. They add roughly two measured seconds and
            # cannot be deferred to an enrichment lane without making this
            # publisher refuse its own otherwise-valid final.
            python -m src.world_state
            python -m src.event_ledger
            python -m src.evolution_engine
            python -m src.product_catalog --write
            # The API contract, openapi spec/datasheet and byte manifest pin
            # the exact bytes of the payloads regenerated above, so they come
            # LAST, in this order, and the manifest generator captures the
            # GIT INDEX -- everything must be staged before it runs or it
            # pins the blobs of the previous commit. Both gaps refused otherwise-
            # valid finals (runs 31682875024, 31687324343).
            python scripts/generate_api_contract.py
            python -m scripts.generate_openapi
            git add -A
            PYTHONPATH=. python scripts/generate_public_api_byte_manifest.py
            git add -A
          '
      - name: Gate and CAS-publish final or value-free refusal
        id: publish
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PIPELINE_FOR_CAS="${{ steps.pipeline.outcome }}"
          AUDIT_FOR_CAS="${{ steps.audit.outcome }}"
          DERIVED_FOR_CAS="${{ steps.derived.outcome }}"
          if [ "${{ steps.guard.outputs.mode }}" = "legacy-verification" ]; then
            PIPELINE_FOR_CAS="success"
            AUDIT_FOR_CAS="success"
            DERIVED_FOR_CAS="success"
          fi
          # The hash-pinned script owns the only direct push. It gates exactly
          # one candidate, compares origin/main to the frozen parent, and
          # refuses rather than rebasing final/history conflicts. Public CI
          # has varied from 24m55s to 36m42s, so the job cap remains the only
          # gate deadline pending a separately budgeted gate architecture.
          bash scripts/publish_final_cas.sh \
            "${{ steps.guard.outputs.target }}" \
            "${{ steps.guard.outputs.base_commit }}" \
            "${{ steps.source.outcome }}" \
            "$PIPELINE_FOR_CAS" \
            "$AUDIT_FOR_CAS" \
            "$DERIVED_FOR_CAS"
      - name: Continue ordered backlog from the new immutable remote tip
        if: steps.publish.outcome == 'success' && steps.guard.outputs.target != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CEILING=$(date -u -d "${{ steps.guard.outputs.contract_today }} - 1 day" +%F)
          if [ "${{ steps.guard.outputs.target }}" != "$CEILING" ]; then
            git fetch --quiet origin main
            RESULT_COMMIT=$(git rev-parse origin/main)
            PROOF=$(python scripts/dispatch_morning_successor.py \
              --base "${{ steps.guard.outputs.base_commit }}" \
              --result "$RESULT_COMMIT" \
              --target "${{ steps.guard.outputs.target }}" \
              --source-run "${{ github.run_id }}" \
              --authority-epoch "${{ github.run_attempt }}")
            printf '%s\n' "$PROOF"
            if printf '%s' "$PROOF" | grep -q '"dispatch_authorized": true'; then
              gh workflow run morning.yml
            fi
          fi
