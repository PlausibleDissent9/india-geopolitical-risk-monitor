name: lane-health

# Make a red lane ARRIVE somewhere a human sees it.
#
# Between 2026-08-12 and 2026-08-17 the daily enrichment lane failed on
# every scheduled run and nobody knew for five days. Not for want of
# checks: ci was red 6/6 and listed all 37 stale payloads BY NAME, and
# the freshness assertion named comparators.json among them. The checks
# were right and loud. Nothing carried them to a person.
#
# GitHub's own notifications fire per failure, which is the exact shape
# people filter into a folder and stop reading, and they cannot report a
# run that never started.
#
# This lane is deliberately NOT a dead man's switch. It runs inside
# Actions, so it cannot tell you Actions stopped firing crons -- which
# this repo has already recorded happening (2026-07-31, the 11:00 slot
# never fired at all). Only an off-platform ping catches that.

on:
  schedule:
    # Three times a day, odd minutes per repo convention. After the
    # morning contract has had time to finish, after the afternoon
    # insurance slot, and overnight.
    - cron: "43 3 * * *"    # 09:13 IST
    - cron: "43 11 * * *"   # 17:13 IST
    - cron: "43 19 * * *"   # 01:13 IST
  workflow_dispatch:

# contents: read ONLY, and that constraint shaped the design.
#
# The first version asked for `issues: write` so it could open a tracking
# issue. src/security_integrity.py refuses any workflow whose permission
# scopes fall outside {contents, actions} -- a deliberate least-privilege
# policy -- and correctly failed this lane with
# workflow_permission_scope_unregistered. Widening that set to admit a
# new scope is a security decision belonging to the founder, not a step
# to be taken in passing to make a monitoring lane convenient.
#
# So the escalation here is the run's own status plus a job summary. One
# aggregate red saying "daily-update has failed 19 consecutive runs" is
# strictly more actionable than nineteen individual reds, which is the
# noise that made the last outage invisible. The issue-opening path still
# exists in the script behind --escalate, for the day the founder decides
# to register the scope.
permissions:
  contents: read

concurrency:
  # Its own group: this must never queue behind the pipeline it reports
  # on, or it goes quiet exactly when the pipeline is stuck.
  group: igrm-lane-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 is a registered control, not a preference: the
          # security plane refuses workflow_checkout_history_shallow so no
          # lane can reason about a truncated history. This lane does not
          # read history at all, and complies anyway rather than carving
          # itself an exception.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Escalate lanes that have been red, close the ones that recovered
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # No pip install: the script uses only the standard library, so
        # this lane cannot be taken down by a dependency resolution
        # failure in the very outage it exists to report.
        run: python scripts/lane_health.py --report
