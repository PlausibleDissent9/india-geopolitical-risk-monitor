name: publish-notes

# Publishing a weekly note should be immediate: commit a file in notes/
# (the GitHub web editor is enough) and the site's notes archive, RSS
# feed, and "latest note" block regenerate within a minute. No login, no
# server -- authorship is repo write access.

on:
  push:
    branches: [main]
    paths: ["notes/**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Scoped by ref: an unscoped group lets a Dependabot PR branch's push
  # event queue a run in the same lane as main and starve it, or race it
  # (2026-08-02, see daily.yml for the mechanism; this is the workflow
  # that first surfaced it as a "Commit" step failure with no retry).
  group: igrm-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Render notes archive, feed, and latest-note block
        run: |
          python -m src.render_site
          python - <<'PY'
          # Mirror run_daily's publish_latest_note so the homepage's
          # "Latest note" updates without waiting for a pipeline run.
          import json, pathlib
          notes = sorted(p for p in pathlib.Path("notes").glob("*.md")
                         if not p.name.endswith(".example"))
          payload = {"filename": None, "markdown": ""}
          if notes:
              latest = notes[-1]
              payload = {"filename": latest.name,
                         "markdown": latest.read_text(encoding="utf-8")}
          out = pathlib.Path("docs/data/note_latest.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload), encoding="utf-8")
          print(f"published: {payload['filename']}")
          PY
      - name: Stamp payload metadata and asset versions
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta
          python -m src.stamp_assets
      - name: Commit
        # Retry the push instead of a single bare attempt: a same-lane
        # push race (2026-08-02: daily-update pushing at the same
        # moment) previously failed this step outright with no retry.
        # Same pattern as daily.yml's push loop.
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add docs || true
          bash scripts/publish_push.sh "notes: publish $(date -u +%F)"
