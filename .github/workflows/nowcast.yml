name: nowcast

# V2-3: a provisional "today so far" score every two hours from the Web
# NGrams bridge. Writes ONLY docs/data/nowcast.json; the historical
# series is never touched, and the daily run's finalized number
# supersedes whatever this published.

on:
  schedule:
    # Odd minute on purpose: GitHub drops scheduled runs at congested
    # minutes (see daily.yml).
    - cron: "43 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Scoped by ref: an unscoped group lets a Dependabot PR branch's push
  # event queue a run in the same lane as main and starve it
  # (2026-08-02, see daily.yml for the mechanism).
  group: igrm-nowcast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    # 45, raised from 30 on 2026-08-10 after #79 was cancelled at the cap.
    # Measured from that run's own steps, and it was not a sick run:
    #
    #   Compute provisional today-so-far    9.9 min
    #   Commit nowcast payload             19.8 min, cancelled at 30
    #
    # The commit step is publish_push.sh, which runs the full committed CI
    # gate inside itself -- ~20 minutes on a hosted runner tonight, against
    # the ~5.2 the lane caps were originally budgeted for. 9.9 + 20 is the
    # whole cap with nothing left for the push, so this lane could no
    # longer finish a healthy run.
    #
    # 45 leaves ~15 minutes of headroom over the measured 30. It is a
    # bigger cap for a bigger gate, not a fix: see the note in morning.yml
    # about whether nine lanes each re-running a 20-minute suite is the
    # architecture we want.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Morning-contract guarantor (dispatch morning lane whenever the final is stale)
        # The daily workflow's own schedule crons have never fired on
        # time in this repo (2026-08-01 through 08-03: every on-time
        # morning publish was a push or self-heal, never the cron).
        # THIS workflow's 2-hourly cron demonstrably does fire, so it
        # doubles as the heartbeat: any nowcast run that finds
        # yesterday's final unpublished dispatches the morning lane.
        #
        # 2026-08-07: this guarantor missed the contract BY ONE MINUTE.
        # It carried an extra condition -- dispatch only after 00:30 UTC
        # -- and that morning GitHub created zero morning-contract runs
        # (all three cron shots dropped) while the one surviving nowcast
        # run landed at 00:29 UTC. The guard said "before 00:30, no
        # dispatch", the next nowcast was 2h14m later, and the site
        # served the previous day past 07:00 IST.
        #
        # The condition is now gone. The measured UTC day closes at
        # 00:00 UTC, so ANY run on a UTC day whose final is unpublished
        # is entitled to dispatch, and morning.yml's own idempotence
        # guard makes a redundant dispatch a ~40-second no-op. Trading a
        # wasted runner-minute for a threshold that can eat the contract
        # is not a trade; it was a bug wearing a rule's clothes.
        run: |
          TODAY=$(date -u +%F)
          GEN=$(python -c "import json; print(json.load(open('docs/data/latest.json'))['_meta']['generated'][:10])" 2>/dev/null || echo "")
          if [ "$GEN" != "$TODAY" ]; then
            echo "latest generated $GEN != $TODAY; dispatching morning-contract lane"
            # -f so an HTTP error fails this step LOUDLY. 2026-08-04: the
            # original `curl -s` returned exit 0 on any API rejection, so a
            # guarantor that dispatched nothing still showed green -- the
            # exact fail-silent pattern this repo's doctrine forbids.
            CODE=$(curl -s -o /tmp/dispatch_body -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/morning.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "dispatch HTTP $CODE"; cat /tmp/dispatch_body || true
            [ "$CODE" = "204" ]
          else
            echo "final already published today ($GEN); no dispatch"
          fi
      - name: Compute provisional today-so-far
        run: python -m src.nowcast
      - name: Stamp payload metadata and asset versions
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta || true
          python -m src.stamp_assets || true
      - name: Commit nowcast payload
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add docs/data/nowcast.json || true
          bash scripts/publish_push.sh "nowcast: $(date -u +%FT%TZ)"
