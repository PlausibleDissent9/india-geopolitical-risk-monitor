name: receipts-extended

# The full-day evidence scan probes every minute and processes every available
# Web NGrams file. It is valuable enrichment, but it is not allowed to hold the
# atomic daily index publication hostage. The daily lane publishes the exact
# scoring-depth evidence first; this independent lane upgrades that same day to
# the broader, explicitly lane-labelled corpus view when the scan completes.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"  # 11:47 IST, clear of the morning contract and backup

permissions:
  contents: write

concurrency:
  group: igrm-receipts-extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Full-day receipts evidence scan
        id: scan
        continue-on-error: true
        timeout-minutes: 150
        env:
          IGRM_RECEIPTS_DEADLINE_S: "8400"
        run: python -m src.receipts_ngrams --extended
      - name: Build extended-evidence derivatives
        if: steps.scan.outcome == 'success'
        timeout-minutes: 15
        run: |
          python -m src.receipts_archive
          python -m src.episode_attribution
          python -m src.spike_breadth
          python -m src.syndication
          # status.json recomputes its alignment from the committed
          # receipts bytes, so it moves whenever this lane's scan does.
          python -m src.status_data
      - name: Stamp payload metadata and assets
        if: steps.scan.outcome == 'success'
        run: |
          python -m src.stamp_meta
          python -m src.stamp_assets
      - name: Machine answers (after the stamps, because they cite hashes)
        # THE CASCADE THIS LANE WAS MISSING. On 2026-08-20 (run
        # 32342408405) the scan SUCCEEDED -- it wrote receipts.json for
        # 2026-08-19, 5/5 channels, 130,662 docs -- and the publish was
        # then refused because three payloads still described the old
        # bytes:
        #   test_assistant_answers::test_the_payload_is_exactly_what_the
        #     _assistant_answers
        #   test_status_alignment::test_published_alignment_payload_is
        #     _recomputed_from_committed_bytes
        #   test_consequence_plan::test_execution_compiles_mixed_source
        #     _dates_to_the_registered_refusal
        # The third is the instructive one: it asserts a date-mismatch
        # refusal, and got 'evidence_unavailable' instead, because the
        # assistant's registered fact snapshots still pinned the previous
        # receipts bytes -- so verification failed before the date check
        # was ever reached. daily.yml has run this cascade all along
        # (aptness, status_data, stamps, then answers); this lane rewrote
        # the same payload and stopped at the stamps.
        #
        # Order matches daily.yml exactly: answers come AFTER the stamps
        # because they cite the stamped hashes.
        if: steps.scan.outcome == 'success'
        run: python -m src.assistant_answers
      - name: Publish complete view or bank incomplete checkpoint
        if: always()
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            # syndication.csv too: python -m src.syndication in the
            # derivatives step appends the day's rows to this TRACKED
            # file, and publish_push.sh's pre-rebase guard refuses a
            # dirty tree outright. Run #2 (2026-08-10) completed a
            # 95-minute scan, built every derivative, then published
            # nothing because this line staged everything except the
            # one file the lane had just modified. The guard was right;
            # the lane forgot its own product.
            git add data/raw/receipt_days data/raw/syndication.csv docs
            if bash scripts/publish_push.sh \
                 "receipts: extended evidence $(date -u +%F)"; then
              exit 0
            fi
            # THE SCAN IS THE EXPENSIVE PART; THE PUBLISH IS THE CHEAP ONE.
            #
            # Until now a gate refusal here threw away the whole scan. On
            # 2026-08-20 (run 32342408405) a 4408s pass COMPLETED, wrote
            # the richest receipts payload the project has produced (5/5
            # channels, 130,662 docs), and the gate refused the candidate
            # over a missing cascade -- so nothing was committed and the
            # banked cache stayed complete=false n_samples=45. Seventy-
            # three minutes of upstream reads, discarded by a failure in
            # the cheapest step. The FAILURE branch below has always
            # banked its checkpoint; the success branch banked nothing.
            # The asymmetry was backwards.
            #
            # publish_push.sh commits the candidate, rebases it onto
            # origin/main, and exits 1 on a red gate -- so the completed
            # cache is sitting in a clean local commit right now. Take
            # ONLY those files out of it, on top of a clean main, and
            # bank them. docs/ is deliberately dropped: the gate refused
            # those bytes and they are not what is expensive to recompute.
            echo "::error::extended publish refused; banking the completed scan cache so the next run resumes instead of rescanning"
            CANDIDATE="$(git rev-parse HEAD)"
            git fetch origin main
            git reset -q --hard origin/main
            git checkout "$CANDIDATE" -- data/raw/receipt_days
            git add data/raw/receipt_days
            bash scripts/publish_push.sh \
              "receipts: bank completed scan cache $(date -u +%F)"
            exit 1
          else
            git add data/raw/receipt_days
            bash scripts/publish_push.sh "receipts: bank partial scan $(date -u +%F)"
            echo "::error::extended receipts scan incomplete; raw checkpoint was banked"
            exit 1
          fi
