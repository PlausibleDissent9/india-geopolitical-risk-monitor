name: validate-and-analyze

# Manual trigger: run AFTER the first backfill has committed
# data/raw/gdelt_volume.csv. Produces docs/data/validation.json (hit-rate,
# placebo, robustness, drift), the precision samples, and the analysis
# outputs (seasonality, alt specs, priced-risk gap, cross-source).
# GDELT-dependent steps are continue-on-error so one rate-limit storm
# doesn't discard the rest; results merge into validation.json per step.

on:
  workflow_dispatch:
  schedule:
    # Weekly retry until every GDELT-dependent check has landed; the
    # gate below turns this into a no-op once validation is complete.
    - cron: "0 14 * * 0"   # Sundays 19:30 IST
  # Self-chaining: fires after every daily-update; the gate job below
  # lets the heavy battery run only when validation has never produced
  # its key figure (first successful backfill), so this runs exactly
  # once autonomously and stays manual thereafter.
  workflow_run:
    workflows: ["daily-update"]
    types: [completed]

permissions:
  contents: write

concurrency:
  # Scoped by ref: an unscoped group lets a Dependabot PR branch's push
  # event queue a run in the same lane as main and starve it
  # (2026-08-02, see daily.yml for the mechanism).
  group: igrm-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif [ -f docs/data/validation.json ] \
            && grep -q '"hit_rate"' docs/data/validation.json \
            && grep -q '"placebo"' docs/data/validation.json \
            && grep -q '"robustness"' docs/data/validation.json \
            && grep -q '"drift"' docs/data/validation.json; then
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Guard - need backfilled data
        run: test -f data/raw/gdelt_volume.csv
      - name: Hit rate (offline, the key figure)
        run: python -m src.validate hit-rate
      - name: Placebo channels (GDELT)
        continue-on-error: true
        run: python -m src.validate placebo
      - name: Dictionary robustness (GDELT)
        continue-on-error: true
        run: python -m src.validate robustness
      - name: Coverage drift (GDELT)
        continue-on-error: true
        run: python -m src.validate drift
      - name: Precision samples (GDELT artlist; author marks Y/N)
        continue-on-error: true
        run: python -m src.validate precision
      - name: Wikipedia cross-source
        continue-on-error: true
        run: python -m src.fetch_wikipedia
      - name: Seasonality (offline)
        run: python -m src.seasonality
      - name: Alternative specifications (offline)
        run: python -m src.alt_specs
      - name: Priced-risk gap (Yahoo Finance)
        continue-on-error: true
        run: python -m src.priced_risk
      - name: Stamp payload metadata and asset versions
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta || true
          python -m src.stamp_assets || true
      - name: Commit results
        if: always()
        env:
          IGRM_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add data/raw docs validation || true
          bash scripts/publish_push.sh "validation + analysis: $(date -u +%F)"
