name: bq-gfg-probe
# G2 feasibility probe (analysis/g2_g4_feasibility.md): measure the
# REAL bytes for one day's Frontpage Graph join before designing any
# lane. Dry-run first (costs nothing, reports bytes), then one capped
# live query only if the dry-run fits the cap. Numbers before design.
on:
  push:
    paths: [".github/workflows/bq-gfg-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-cloud-bigquery
      - env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from google.cloud import bigquery
          from google.oauth2 import service_account

          def record(lines):
              # The probe's findings persist in the repo, not in run
              # logs nobody can read a week later.
              stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              with open("analysis/gfg_probe_results.md", "a") as f:
                  f.write(f"\n## Probe run {stamp}\n\n")
                  for ln in lines:
                      f.write(ln + "\n")

          info = json.loads(os.environ["GCP_SA_JSON"])
          creds = service_account.Credentials.from_service_account_info(info)
          client = bigquery.Client(project=os.environ["GCP_PROJECT_ID"],
                                   credentials=creds)
          # First probe (2026-08-06) found a RECENT day nearly empty:
          # 39,351 links from 230 frontpages, 0 bytes billed -- against
          # GDELT's stated 50,000 homepages/hour that means the recent
          # partition is a husk, not a bargain. Probe both a recent and
          # a 2019 day to date the stall before any verdict.
          def day_q(day, nxt):
              return (
                  "SELECT COUNT(*) AS n_links, "
                  "  COUNT(DISTINCT FromFrontPageURL) AS n_frontpages "
                  "FROM `gdelt-bq.gdeltv2.gfg_partitioned` "
                  f"WHERE _PARTITIONTIME >= TIMESTAMP('{day}') "
                  f"  AND _PARTITIONTIME < TIMESTAMP('{nxt}')"
              )
          q = day_q('2026-08-04', '2026-08-05')
          q_hist = day_q('2019-05-15', '2019-05-16')
          CAP = 5 * 10**9
          lines = []
          for label, query in (("recent 2026-08-04", q),
                               ("historical 2019-05-15", q_hist)):
              dry = client.query(query,
                                 job_config=bigquery.QueryJobConfig(dry_run=True))
              gb = dry.total_bytes_processed / 1e9
              if dry.total_bytes_processed > CAP:
                  lines.append(f"- {label}: dry-run {gb:.1f} GB exceeds the "
                               "5 GB cap; not queried live")
                  print(f"[gfg-probe] {label}: {gb:.1f} GB exceeds cap")
                  continue
              job = client.query(query, job_config=bigquery.QueryJobConfig(
                  maximum_bytes_billed=CAP))
              row = list(job)[0]
              lines.append(f"- {label}: {row['n_links']:,} links from "
                           f"{row['n_frontpages']:,} frontpages "
                           f"(dry-run {gb:.2f} GB)")
              print(f"[gfg-probe] {label}: {row['n_links']:,} links, "
                    f"{row['n_frontpages']:,} frontpages")
          lines.append(
              "- INTERPRETATION RULE (ex-ante): if the historical day "
              "shows orders of magnitude more frontpages than the recent "
              "day, the GFG has stalled and G2 is infeasible for the "
              "LIVE instrument (historical-study use only) -- an empty "
              "recent partition priced at 0 bytes is a husk, not a "
              "bargain.")
          record(lines)
          PY
      - name: Commit the measured result
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add analysis/gfg_probe_results.md
          git commit -m "gfg probe: measured result $(date -u +%F)" || exit 0
          for i in 1 2 3; do
            if git pull --rebase origin main; then git push && exit 0
            else git rebase --abort || true; fi
            sleep $((10 * i))
          done
          echo "push failed; result remains in run log"
