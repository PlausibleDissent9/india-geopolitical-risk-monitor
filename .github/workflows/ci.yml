name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Frozen validation and benchmark registrations resolve historical
          # commits. A shallow checkout makes those integrity checks fail.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Environment matches exact pins
        run: python scripts/check_environment.py
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests + coverage
        run: python -m pytest --cov=src --cov-report=term-missing -q
