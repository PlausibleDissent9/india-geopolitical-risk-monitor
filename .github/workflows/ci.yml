name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Manual runs: the live-site tests make ci the only lane that can
  # certify what igrm.in actually serves, and on 2026-08-20 the only way
  # to re-certify after a heal was to wait for an unrelated push. A
  # dispatch runs the identical checks on demand.
  workflow_dispatch:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Frozen validation and benchmark registrations resolve historical
          # commits. A shallow checkout makes those integrity checks fail.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Environment matches exact pins
        run: python scripts/check_environment.py
      - name: Security integrity plane matches the exact repository controls
        run: python -m src.security_integrity --write && git diff --exit-code -- docs/data/security_integrity.json
      - name: Public product catalog and route floor
        run: python -m src.product_catalog --check
      - name: World State Matrix exposes every registered geometry-layer cell
        run: python -m src.world_state --check
      - name: Global Event and Episode Ledger keeps aggregate rows, unique events and detector windows separate
        run: python -m src.event_ledger --check
      - name: Continuous Evolution capability ledger matches registered denominators
        run: python -m src.evolution_engine --check
      - name: Knowledge replay synthetic conformance artifact is current
        run: python -m src.knowledge_replay_fixture && git diff --exit-code -- docs/data/knowledge_replay_demo.json
      - name: Sensor Fusion synthetic conformance artifact is current
        run: python -m src.sensor_fusion_fixture && git diff --exit-code -- docs/data/sensor_fusion_demo.json
      - name: Exposure DNA synthetic conformance artifact is current
        run: python -m src.exposure_dna_fixture && git diff --exit-code -- docs/data/exposure_dna_demo.json
      - name: Shock Compiler synthetic conformance artifact is current
        run: python -m src.shock_compiler_fixture && git diff --exit-code -- docs/data/shock_compiler_demo.json
      - name: Evidence Output Engine synthetic conformance artifacts are current
        run: python -m src.evidence_outputs_fixture && git diff --exit-code -- docs/data/evidence_outputs_demo.json docs/downloads/igrm-evidence-outputs-demo.zip
      - name: Exposure traversal shared-world artifact is current
        run: python -m src.exposure_traversal_fixture && git diff --exit-code -- docs/data/exposure_traversal_demo.json
      - name: Max engines describe one governed state
        run: python -m src.max_state_join_fixture && git diff --exit-code -- docs/data/max_state_join_demo.json
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests + coverage
        run: python -m pytest --cov=src --cov-report=term-missing -q
