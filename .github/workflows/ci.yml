name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Frozen validation and benchmark registrations resolve historical
          # commits. A shallow checkout makes those integrity checks fail.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Environment matches exact pins
        run: python scripts/check_environment.py
      - name: Public product catalog and route floor
        run: python -m src.product_catalog --check
      - name: Knowledge replay synthetic conformance artifact is current
        run: python -m src.knowledge_replay_fixture && git diff --exit-code -- docs/data/knowledge_replay_demo.json
      - name: Sensor Fusion synthetic conformance artifact is current
        run: python -m src.sensor_fusion_fixture && git diff --exit-code -- docs/data/sensor_fusion_demo.json
      - name: Exposure DNA synthetic conformance artifact is current
        run: python -m src.exposure_dna_fixture && git diff --exit-code -- docs/data/exposure_dna_demo.json
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests + coverage
        run: python -m pytest --cov=src --cov-report=term-missing -q
