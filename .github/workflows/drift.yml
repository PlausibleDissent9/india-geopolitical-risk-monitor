name: coverage-drift

# MI1's diagnostic recompute (methodology s7.7). Runs on a GitHub
# runner because its GDELT calls (corpus-norm chunks + per-year artlist
# samples) are the API-heaviest single job in the project: 2026-08-06,
# three runs from two residential/VPS IPs died on 429s while the same
# call pattern has always survived on runner IPs. Weekly is the right
# cadence for a statistic whose unit is the year; drift() itself fails
# soft on the artlist garnish, so the page-promised stats publish even
# under rate-limit hostility.

on:
  schedule:
    - cron: "40 22 * * 0"   # Sundays 04:10 IST, far from every other lane
  workflow_dispatch:
  push:
    branches: [main]
    # Editing this file IS the no-CLI dispatch mechanism: touch the
    # run-stamp below and push to trigger a run from any machine.
    paths: [".github/workflows/drift.yml"]

# run-stamp: 2026-08-06T03:00+05:30 (first dispatch)

permissions:
  contents: write

concurrency:
  group: igrm-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compute coverage drift
        run: python -m src.validate drift
      - name: S5 Media Cloud cross-validation (weekly; fail-closed sans key)
        continue-on-error: true
        timeout-minutes: 15
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: |
          pip install --quiet mediacloud
          python -m src.media_cloud
      - name: V17 GPR replication wedge (weekly; cite-not-redistribute)
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.gpr_comparison
      - name: S3 energy context (JODI official statistics, weekly)
        continue-on-error: true
        timeout-minutes: 10
        run: python -m src.fetch_jodi
      - name: Stamp payload metadata and asset versions
        # Nine workflows commit into docs/. Until 2026-08-07 exactly ONE
        # of them stamped, so the codebook's promise that every download
        # carries its licence and citation held only for whatever
        # daily.yml happened to write last. The notes lane proved it at
        # 14:31Z: it republished note_latest.json without _meta at all,
        # and regenerated three pages with unversioned stylesheet links.
        #
        # Both stamps are idempotent and offline, so running them in
        # every publishing lane costs nothing and removes the assumption
        # that some other lane will tidy up afterwards.
        continue-on-error: true
        run: |
          python -m src.stamp_meta || true
          python -m src.stamp_assets || true
      - name: Commit
        run: |
          git config user.name "igrm-bot"
          git config user.email "actions@github.com"
          git add docs/data/validation.json data/raw || true
          bash scripts/publish_push.sh "validation: coverage drift recomputed (weekly lane)"
