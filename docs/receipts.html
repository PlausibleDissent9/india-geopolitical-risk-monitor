<meta name="description" content="Receipts drill-down: the exact query behind a channel's score, and a tier-sorted sample of the matched articles.">

  <nav class="masthead">

<div id="body"><p class="empty">Loading receipts&hellip;</p></div>

<footer>
  <p><a href="./">&larr; back to the index</a></p>
  <p>Source tiers order presentation credible-first and feed the tier 1-2 share only; they never enter any score. See the <a href="methodology.html">methodology</a> and <a href="data.html">data page</a>.</p>
</footer>

<script>
"use strict";
async function j(p) { try { const r = await fetch(p); return r.ok ? r.json() : null; } catch { return null; } }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const TIER_LABEL = { 1: "tier 1", 2: "tier 2", 3: "tier 3", 4: "tier 4" };
function tierBadge(tier) {
  const label = TIER_LABEL[tier] || "unranked";
  return '<span class="tier-badge tier-' + (tier || "u") + '">' + label + "</span>";
}

(async () => {
  const q = new URLSearchParams(location.search);
  const channel = q.get("channel");
  const el = document.getElementById("body");
  const [receipts, shelf, rel, cp, latest, brief, apt] = await Promise.all([
    j("data/receipts.json"), j("data/expert_shelf.json"),
    j("data/map_relations.json"), j("data/chokepoints.json"),
    j("data/latest.json"), j("data/daily_brief.json"), j("data/aptness.json"),
  ]);
  // Stale-date guard: aptness labels apply only to the receipts payload
  // they were computed from; a date mismatch shows unfiltered receipts.
  const aptFresh = apt && receipts && apt._meta && apt._meta.date === receipts.date
    ? apt : {channels: {}, _meta: null};

  // Evidence layers degrade INDEPENDENTLY: a missing articles sample
  // must not hide the expert shelf, the event record, or the physical
  // check, which come from different pipelines entirely.
  const c = receipts && receipts.channels && receipts.channels[channel];
  const chLabel = (c && c.label) || (latest && latest.channels && latest.channels[channel]
    ? latest.channels[channel].label : channel);
  if (!chLabel) { el.innerHTML = '<p class="empty">Unknown channel.</p>'; return; }
  document.title = chLabel + " evidence, India Geopolitical Risk Monitor";

  let html = "<h2>" + esc(chLabel) + ": the evidence card" +
    (receipts && receipts.date ? " for " + esc(receipts.date) : "") + "</h2>";
  if (latest && latest.channels && latest.channels[channel]
      && latest.channels[channel].score != null) {
    html += '<p class="kv">Score today: <strong>' +
      esc(latest.channels[channel].score.toFixed(1)) +
      "</strong> (percentile of this channel's own trailing two years; salience, not risk).</p>";
  }

  // Machine-written brief: shown only when it exists for the same day
  // the page is describing, always labeled, never the author's voice.
  if (brief && brief.channels && brief.channels[channel] && latest
      && brief.date === latest.date) {
    html += '<p class="kv"><span class="prov">Machine-written brief</span> ' +
      esc(brief.channels[channel]) +
      " <em>(generated by a language model from the data on this page; " +
      "not the author's words)</em></p>";
  }

  if (c) {
    const caveat = (receipts._meta && receipts._meta.caveat) || "";
    html += '<p class="kv">' + esc(caveat) + "</p>";
    // Collapsed for the same reason as the tier legend below: this is
    // the page's transparency core and it is read once, not on every
    // visit. Hiding it behind a summary would be wrong if it were hard
    // to find — it is one tap, labelled, and open by keyboard. The
    // articles are what the reader came for.
    html += "<details class='kv tier-legend'><summary><strong>The exact query</strong> " +
      "(the frozen dictionary terms this channel's score is computed from)</summary>";
    html += c.queries.map(qq => '<p class="kv"><code>' + esc(qq) + "</code></p>").join("");
    html += "</details>";
    // An exhausted pool is "all N", never a "sample": calling the full
    // retrievable set a sample implies withheld depth that does not
    // exist. Payloads from before 2026-08-04 lack the flag and keep the
    // old wording.
    if (c.pool_exhausted) {
      html += "<h2>Matched articles (tier-sorted; all " + esc(c.n_retrieved) +
        " unique articles retrievable for this day)</h2>";
    } else if (c.n_pool_unique != null) {
      html += "<h2>Matched articles (top " + esc(c.n_retrieved) + " of " +
        esc(c.n_pool_unique) + " unique retrieved, tier-sorted)</h2>";
    } else {
      html += "<h2>Matched articles (tier-sorted, sample of " + esc(c.n_retrieved) + ")</h2>";
    }
    if (c.spike_quality_tier12_share != null) {
      html += '<p class="kv">Spike-quality: ' + esc((c.spike_quality_tier12_share * 100).toFixed(0)) +
        "% of this sample is tier 1-2 (wires, broadsheets, business press).</p>";
    }
    // Collapsed by design. This legend is 523px tall on a 375px screen
    // and sat directly between the reader and the articles, so the
    // first receipt began at y=1258 — past one and a half phone
    // screens, with zero articles visible on arrival. It is reference
    // content: needed once, not on every visit. <details> keeps it one
    // tap away, keyboard-reachable, and present for anyone reading the
    // page without CSS.
    html += "<details class='kv tier-legend'><summary><strong>What the tiers mean</strong> " +
      "(registered criteria, source_tiers.json, append-only with dated reasons)</summary><ul class='receipts-list'>" +
      "<li>" + tierBadge(1) + " wire services and public-service international broadcasters " +
      "with formal correction processes (Reuters, AP, AFP, BBC)</li>" +
      "<li>" + tierBadge(2) + " national and international broadsheets and business press " +
      "with mastheads and published corrections</li>" +
      "<li>" + tierBadge(3) + " mainstream TV, portals, and aggregating outlets with " +
      "editorial staff but weaker correction records</li>" +
      "<li>" + tierBadge(4) + " outlets with documented fabrication incidents, or " +
      "syndication mills with no original reporting</li>" +
      "<li>" + tierBadge(null) + " domain not yet registered; sorts after every tier, " +
      "never assumed into one</li></ul>" +
      "<p>Tiers order this list credible-first and feed the tier 1-2 share; they never " +
      "enter any score. A day with no tier-1 rows means no wire-service article was " +
      "retrievable for this exact query that day, not that wires were filtered out. " +
      "Stories whose headline carries a channel phrase sort first within each tier; " +
      "a <em>full-text match</em> tag means the phrase appears only in the article body, " +
      "so the story may merely mention the channel rather than be about it.</p></details>";
    if (c.n_matched_in_corpus != null) {
      html += '<p class="kv">Provenance: <b>' + esc(c.n_matched_in_corpus) +
        "</b> articles matched inside the day's scored sample itself" +
        (c.n_matched_extended ? ", <b>" + esc(c.n_matched_extended) +
          "</b> more matched across the rest of the day's full corpus" : "") +
        (c.n_artlist_supplement ? ", plus <b>" + esc(c.n_artlist_supplement) +
          "</b> retrieved from GDELT's relevance search " +
          "(wire originals whose syndicated copies the corpus caught)" : "") +
        ". Articles from the scored sample are ones the day's estimator actually counted.</p>";
    }
    if (c.articles.length) {
      // Machine aptness pre-filter (registered rubric, display-layer
      // only): OFF articles collapse behind a visible count with a
      // toggle — never silently deleted, and the machine's error rate
      // vs the founder's own rulings is shown beside the count.
      const chApt = (aptFresh.channels && aptFresh.channels[channel]) || {};
      const row = a =>
        "<li>" + tierBadge(a.tier) + ' <a href="' + esc(a.url) + '" rel="noopener" target="_blank">' +
        esc(a.title || a.url) + "</a> <span class='kv'>&middot; " + esc(a.domain) +
        (a.lane === "corpus" ? " &middot; in scored sample" :
          (a.lane === "corpus-extended" ? " &middot; in day's corpus" :
            (a.lane === "artlist" ? " &middot; retrieved" : ""))) +
        (a.match === "full-text" ? " &middot; full-text match" : "") + "</span></li>";
      const shown = c.articles.filter(a => chApt[a.url] !== "OFF");
      const hidden = c.articles.filter(a => chApt[a.url] === "OFF");
      html += "<ul class='receipts-list'>" + shown.map(row).join("") + "</ul>";
      if (hidden.length) {
        const agr = aptFresh._meta && aptFresh._meta.founder_agreement;
        html += "<details><summary>" + esc(hidden.length) +
          " article(s) judged off-construct by the machine rubric (" +
          esc((aptFresh._meta && aptFresh._meta.model) || "model") +
          (agr && agr.rate != null ? "; agreement with the founder's rulings " +
            esc(agr.rate) + " on " + esc(agr.n_overlap) + " overlaps" : "") +
          ") &mdash; show them</summary><ul class='receipts-list'>" +
          hidden.map(row).join("") + "</ul></details>";
      }
    } else {
      html += '<p class="empty">No articles retrieved for this query on this day.</p>';
    }
    html += '<div id="archive-slot"></div>';
  } else {
    const why = (receipts && receipts._meta && receipts._meta.partial)
      ? "the latest fetch run did not complete this channel (a partial result)"
      : "article samples publish for the latest day only";
    html += '<p class="empty">Article sample not available: ' + why +
      ". The layers below come from independent pipelines and are current.</p>";
  }

  // ---- Why card layers (practitioner item 1): every evidence source ----
  const PARTNERS = { pakistan_west: ["PAK", "AFG"], china_east: ["CHN", "BTN", "NPL"],
    gulf_energy: ["IRN", "SAU", "ARE", "QAT", "IRQ", "ISR"], us_trade: ["USA"],
    shipping: ["IRN", "YEM", "EGY", "SAU", "SGP", "MYS", "IDN"] };

  if (shelf && shelf.channels) {
    const items = (shelf.channels[channel] || []).slice(0, 5);
    html += "<h2>What the expert roster published</h2>";
    if (items.length) {
      html += "<ul class='receipts-list'>" + items.map(it =>
        "<li><a href='" + esc(it.url) + "' rel='noopener' target='_blank'>" + esc(it.title) +
        "</a> <span class='kv'>&middot; " + esc((shelf._meta.labels || {})[it.institution] || it.institution) +
        ", " + esc(it.date) + "</span></li>").join("") + "</ul>";
    } else {
      html += '<p class="kv">No roster publication matched this channel\'s vocabulary in the last ' +
        esc(shelf._meta.window_days) + " days; the press wave, if any, is not echoed by the think-tank shelf yet.</p>";
    }
  }

  if (rel && rel.partners) {
    html += "<h2>The event record: this channel's partners, trailing year</h2><ul class='receipts-list'>";
    for (const p of (PARTNERS[channel] || [])) {
      const d = rel.partners[p];
      if (!d) continue;
      html += "<li><strong>" + esc(d.name) + "</strong>: " + esc(d.recent_n) +
        " press-recorded events, conflict share " +
        (d.recent_conflict_share == null ? "-" : esc((d.recent_conflict_share * 100).toFixed(1)) + "%") + "</li>";
    }
    html += "</ul><p class='kv'>Counts of events the world's press recorded (GDELT dyads); a coverage spike with these numbers flat means the narrative is running ahead of the record.</p>";
  }

  if (channel === "shipping" && cp && cp.chokepoints) {
    html += "<h2>The physical check: corridors, latest complete week</h2><ul class='receipts-list'>";
    for (const [k, c2] of Object.entries(cp.chokepoints)) {
      const n = c2.weeks.length - 1;
      html += "<li><strong>" + esc(k.replace(/_/g, " ")) + "</strong>: salience " +
        esc(c2.salience_pct[n]) + " pct vs transits " + esc(c2.transits_pct[n]) + " pct</li>";
    }
    html += "</ul><p class='kv'>Attention high while transits are normal reads as a media wave; both moving together reads as a real disruption.</p>";
  }

  el.innerHTML = html;

  // Available recent archive (up to seven committed cache days, never
  // padded and never described as complete when cache days are absent). Loaded
  // after the main render so today's evidence paints first.
  const slot = document.getElementById("archive-slot");
  if (slot) {
    const arch = await j("data/receipts_archive.json");
    const chArch = arch && arch.channels && arch.channels[channel];
    const today = receipts && receipts.date;
    if (chArch && chArch.days) {
      const days = Object.keys(chArch.days).sort().reverse()
        .filter(d => d !== today);
      let ahtml = "";
      let total = 0;
      for (const d of days) {
        const block = chArch.days[d];
        if (!block.articles || !block.articles.length) continue;
        total += block.articles.length;
        ahtml += "<details><summary><b>" + esc(d) + "</b> &middot; " +
          esc(block.articles.length) + " shown of " + esc(block.n_matched) +
          " matched</summary><ul class='receipts-list'>" +
          block.articles.map(a =>
            "<li>" + tierBadge(a.tier) + ' <a href="' + esc(a.url) +
            '" rel="noopener" target="_blank">' + esc(a.title || a.url) +
            "</a> <span class='kv'>&middot; " + esc(a.domain) +
            (a.match === "full-text" ? " &middot; full-text match" : "") +
            "</span></li>").join("") + "</ul></details>";
      }
      if (ahtml) {
        slot.innerHTML = "<h2>Earlier this week</h2>" +
          '<p class="kv">' + esc(total) + " more matched articles across " +
          "available earlier days, from the same committed corpus scans, " +
          "assembled and tier-sorted identically. Every article is dated; " +
          "depth comes from days, never from padding.</p>" + ahtml;
      }
    }
  }
})();
</script>
